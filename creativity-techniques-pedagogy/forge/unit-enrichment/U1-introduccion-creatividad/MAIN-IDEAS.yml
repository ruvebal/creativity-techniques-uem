ideas:
  - id: 1
    heading: Open, then close
    sentence: "First invent many possibilities. Then pick what fits the needs of the brief."
    quote: "The same creative act may involve both divergent and convergent thinking."
    chicago: "(Craft 2003, 43)"
  - id: 2
    heading: Four skills you can train
    sentence: "Fluency (many ideas), flexibility (many angles), originality (unusual links), elaboration (work the details)."
    quote: "Fluency - the ability to produce a large number of ideas or solutions to a problem rapidly."
    chicago: "(Chen 2012, 41)"
  - id: 3
    heading: Tests are not the whole story
    sentence: "Scoring well on “uses of a brick” does not prove you are strong in another field."
    quote: "After all, the ability of divergent thinking with a paper clip may tell us little about an individual's talent in music."
    chicago: "(Chen 2012, 41)"
  - id: 4
    heading: Name the problem first
    sentence: "Before you grab a creativity technique, say what is unclear in the brief."
    chicago: null
    stance: studio_hypothesis
  - id: 5
    heading: Techniques are tools, not scripts
    sentence: "A method helps you talk with the situation. It does not replace your judgement."
    chicago: null
    stance: studio_hypothesis
  - id: 6
    heading: “Design thinking” is debated
    sentence: "Use useful tools — and ask when buzzwords hide weak craft."
    chicago: null
    stance: studio_hypothesis
