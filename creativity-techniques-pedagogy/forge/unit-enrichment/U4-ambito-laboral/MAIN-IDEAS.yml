ideas:
  - id: 1
    heading: Conditions beat slogans
    sentence: Workplaces foster or kill creativity through time, safety, and permission — not posters.
    chicago: "(Fisher 2012, 27)"
  - id: 2
    heading: Watch passion rhetoric
    sentence: “Do anything for the brief” can mask unpaid labour and self-exploitation.
    chicago: null  # Lucas & Knotts 2026 — Ahmes cite not evaluator_safe this pass
  - id: 3
    heading: Design the diverge window
    sentence: Deadlines need a protected generation phase before pitch mode.
    chicago: "(Michalko 2010, 440)"  # pdf_order; Lab method anchor
  - id: 4
    heading: Techniques meet stakeholders
    sentence: Dots on the wall show the team’s favourite ideas. They do not show that a real visitor can use the design.
    chicago: "(Michalko 2010, 402)"  # pdf_order; Wall of Ideas
  - id: 5
    heading: Pitch is convergent craft
    sentence: "Presenting is part of creativity technique: criteria, story, constraint honesty."
    chicago: null
  - id: 6
    heading: Ethics inside the method
    sentence: Judgment about harm, credit, and feasibility belongs in the workplace toolkit.
    chicago: null
