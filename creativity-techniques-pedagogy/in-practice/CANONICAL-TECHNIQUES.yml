    steps:
      - Write the problem in one sentence.
      - Answer a set of questions about the problem (what is unknown, what is given, what is similar) in writing.
      - Then answer questions about the plan (which parts can be solved first, what would a partial solution look
        like).
      - Rewrite the problem statement using what the questions revealed.
      - Compare the first and last statements.
