    source_status: verified
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Draw two diamonds side by side - problem space, then solution space.
      - Plan an opening (diverge) and a closing (converge) move for each diamond.
      - Assign one technique from this catalogue to each of the four moves.
      - Mark where the team will check whether it is solving the right problem.
