    source_status: verified
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - State the observed problem or failure.
      - Ask why it happened; write the answer.
      - Ask why again of that answer, up to five times.
      - Stop when an answer points to something you can change in the design.
      - Check that the chain does not end at blaming a person.
