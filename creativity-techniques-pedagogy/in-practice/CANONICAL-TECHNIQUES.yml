  - id: five-user-interviews
    name: Five-user test interviews
    family: development
    mode: convergent
    primary_source: knapp-2016
    source_locator: chap. 15 Small Data
    source_status: verified
    catalogue_records:
      - urn:in-practice:exercise:cddf1c59bd27e75458482cea
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Recruit five people close to the intended users.
      - Each tests the prototype one at a time while the team watches.
      - The interviewer asks open questions and lets the person think aloud.
      - Observers note reactions on a shared grid.
      - Look for patterns seen with three or more people.
    time_min: 60
    group_size: 3–5 plus five testers
    materials:
      - prototype
      - interview guide
      - observation grid
    units:
      - U3
      - U4
    evidence: untested
    accessibility: Testers recruited with access needs in mind; consent script required.
  - id: mom-test-interview
    name: Mom Test interview
    family: development
    mode: convergent
    primary_source: gap
    gap_work: Fitzpatrick 2013 (attribution unverified)
    source_status: gap
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Write questions about the person's past behaviour, not about your idea.
      - Ask about the last time they had the problem and what they did.
      - Avoid asking whether they would like or buy your idea.
      - Record facts and commitments, not compliments.
      - Summarise what the answers say about the problem.
    time_min: 30
    group_size: 2 (interviewer and note-taker)
    materials:
      - question list
      - notes
    units:
      - U4
    evidence: untested
    accessibility: Remote or text interviews allowed.
  - id: young-five-steps
    name: Young's five steps
    family: development
    mode: both
    primary_source: gap
    gap_work: Young 1965 (manifest key young-1965)
    source_status: gap
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Gather material - specific to the problem and general.
      - Work over the material, trying combinations.
      - Put the problem aside and do something else.
      - Write down the idea when it appears.
      - Shape and test the idea with others.
    time_min: 60
    group_size: individual
    materials:
      - notebook
    units:
      - U2
      - U6
    evidence: 'gap: Young 1965.'
    accessibility: Spread over a week; no single session required.
