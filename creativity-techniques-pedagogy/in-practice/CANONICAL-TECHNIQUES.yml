techniques:
  - id: alternative-uses-task
    name: Alternative Uses Task (AUT)
    family: generation
    mode: divergent
    primary_source: chen-2011
    source_locator: p. 26 (unusual-uses / brick test reported with Guilford's abilities)
    source_status: verified
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Show one everyday object (brick, paperclip, shoe) and start a visible timer.
      - Each student lists as many different uses as they can, alone and in silence.
      - Stop; each student counts ideas (fluency) and use categories (flexibility).
      - Pool the class lists; a use that appears on only one list counts as original.
      - Each student picks one use and adds detail to it (elaboration).
      - Discuss which category shifts produced the less obvious uses.
    time_min: 15
    group_size: individual, class pooling
    materials:
      - object or image
      - paper
      - timer
    units:
      - U1
      - U2
    evidence: 'Chen 2011, 26: divergent-thinking scores did not carry over across domains; use AUT as practice and
      self-diagnosis, not as a talent measure.'
    accessibility: Oral or typed lists accepted; image prompt can replace a physical object.
