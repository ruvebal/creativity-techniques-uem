  - id: tzara-cut-up
    name: Tzara cut-up
    family: generation
    mode: divergent
    primary_source: gap
    gap_work: Tzara 1920 (attribution unverified)
    source_status: gap
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Take a text tied to a real brief (a product description, a news item).
      - Cut it into single words or short phrases.
      - Mix the pieces in a bag and draw them one at a time.
      - Write them down in the order drawn.
      - Underline any phrase that suggests an idea for the brief and write the idea.
      - Name which moves were divergent (cutting, drawing) and which convergent (choosing).
    time_min: 20
    group_size: 1–3
    materials:
      - printed text
      - scissors
      - bag or envelope
    units:
      - U1
      - U5
    evidence: untested
    accessibility: Digital shuffle of words replaces scissors for students with limited hand use.
