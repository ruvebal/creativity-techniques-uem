  - id: parallel-prototyping
    name: Parallel prototyping
    family: development
    mode: both
    primary_source: dow-2010
    source_locator: article 18, p. 18:1
    source_status: verified
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Make three different quick prototypes of the same brief before getting feedback.
      - Get feedback on all three at once.
      - Note what each prototype taught you.
      - Combine the strongest elements into the next version.
      - Compare with what one prototype at a time would have shown.
    time_min: 45
    group_size: 1–3
    materials:
      - paper
      - card
      - tape or digital mock-up tool
    units:
      - U3
      - U5
    evidence: 'Dow et al. 2010, 18:1: parallel prototyping gave better and more varied designs and more self-efficacy
      than serial iteration.'
    accessibility: Prototypes in any medium (paper, digital, verbal scenario).
