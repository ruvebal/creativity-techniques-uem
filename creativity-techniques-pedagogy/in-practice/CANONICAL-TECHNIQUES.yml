  - id: lightning-demos
    name: Lightning demos
    family: generation
    mode: divergent
    primary_source: knapp-2016
    source_locator: chap. 8 Remix and Improve (Lightning Demos)
    source_status: verified
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Each student brings two or three existing solutions from other fields or products.
      - Each gives a three-minute tour of what is good about one example.
      - A scribe draws a quick sketch and headline of each big idea on the board.
      - The group looks for ideas to borrow and remix, not to copy.
    time_min: 30
    group_size: 4–8
    materials:
      - devices or printouts
      - board
      - markers
    units:
      - U3
      - U4
      - U5
    evidence: untested
    accessibility: Examples can be shown on screen with captions; scribe role optional.
  - id: swipe-file
    name: Swipe file (collect and credit influences)
    family: reflection
    mode: divergent
    primary_source: gap
    gap_work: Kleon 2012 (held, not in references.yml)
    source_status: held
    held_note: Records from Kleon (Steal Like an Artist; Keep Going), not in references.yml.
    catalogue_records:
      - urn:in-practice:exercise:6ca7ab8778d6de98f63f7003
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Keep a folder of work you admire, each item with its creator and source.
      - For each item, write what exactly you would borrow (a move, not the whole work).
      - Combine two borrowed moves in a small piece of your own.
      - Credit every influence in the piece's notes.
