  - id: weighted-decision-matrix
    name: Weighted decision matrix
    family: selection
    mode: convergent
    primary_source: gap
    gap_work: attribution unverified
    source_status: gap
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - List the options as rows.
      - Agree three to five criteria and give each a weight.
      - Score each option against each criterion (1–5).
      - Multiply by weights and total.
      - Check the winner against intuition; discuss any disagreement before deciding.
