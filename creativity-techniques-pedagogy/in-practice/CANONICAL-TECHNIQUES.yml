    steps:
      - State one problem as a question everyone can read.
      - 'Agree the ground rule: no criticism until the idea round ends.'
      - A scribe records every idea, numbered, in the speakers' words.
      - Invite combinations and improvements of ideas already on the board.
      - Stop at the time limit, not when ideas slow down.
      - Only then move to a separate selection technique.
