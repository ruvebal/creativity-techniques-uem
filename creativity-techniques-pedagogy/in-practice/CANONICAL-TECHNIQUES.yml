    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Take the problem on a twenty-minute walk.
      - Note things you see and connect each to the problem.
      - Record ideas as voice notes or quick sketches.
      - Back in class, pick two ideas to develop.
