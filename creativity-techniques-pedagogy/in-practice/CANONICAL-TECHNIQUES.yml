  - id: pure-contour-drawing
    name: Pure contour drawing
    family: embodied
    mode: divergent
    primary_source: gap
    gap_work: Edwards (held, not in references.yml)
    source_status: held
    held_note: Pure contour records from Edwards (The New Drawing on the Right Side of the Brain).
    catalogue_records:
      - urn:in-practice:exercise:08ed3d62f2ed0d8027965388
      - urn:in-practice:exercise:91ac1033c9941b7e913b38f9
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Choose an object with detail (a hand, a crumpled paper).
      - Look only at the object, not the paper, for five minutes.
      - Let the pen follow the edges your eyes follow, slowly.
      - Look at the result and note what you saw that you usually miss.
    time_min: 10
    group_size: individual
    materials:
      - paper
      - pen
      - object
    units:
      - U1
      - U6
    evidence: untested
    accessibility: Opt-out - written description of edges, or tracing on a tablet; no drawing skill assumed.
