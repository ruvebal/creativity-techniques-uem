  - id: hits-dot-voting
    name: Hits and dot voting
    family: selection
    mode: convergent
    primary_source: knapp-2016
    source_locator: chap. 10 Decide (Heat map; Straw poll)
    source_status: verified
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Put all ideas on the wall, one per note or sheet.
      - Read in silence; each student places small dots on parts that look strong (hits).
      - Each student then gets one larger vote for one idea.
      - Cluster the dots and read out the top three.
      - The decider (or the group) chooses, and records why.
    time_min: 15
    group_size: 3–10
    materials:
      - dot stickers
      - wall or board
    units:
      - U2
      - U4
    evidence: untested
    accessibility: Digital whiteboard voting; allow seated access to the wall.
  - id: note-and-vote
    name: Note-and-vote
    family: selection
    mode: convergent
    primary_source: knapp-2016
    source_locator: chap. 11 Rumble (Note-and-Vote)
    source_status: verified
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Each student writes their best ideas on paper, in silence.
      - Each picks their single favourite.
      - Go round the group; each reads out the favourite and it is written on the board.
      - Everyone votes once, in silence.
      - The decider makes the final call.
    time_min: 15
    group_size: 3–8
    materials:
      - paper
      - board
    units:
      - U3
      - U4
    evidence: untested
    accessibility: Votes can be written or typed.
  - id: cocd-box
    name: COCD box
    family: selection
    mode: convergent
    primary_source: gap
    gap_work: origin attribution unverified
    source_status: gap
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Draw a two-by-two grid - originality (low/high) by feasibility (low/high).
      - Place each idea in a quadrant after a short discussion.
      - Name the quadrants - now (feasible, ordinary), wow (feasible, original), how (original, not yet feasible),
        and discard.
      - Keep wow ideas for development and how ideas for later.
    time_min: 15
    group_size: 3–6
    materials:
      - grid on board or paper
      - sticky notes
    units:
      - U2
    evidence: 'gap: no verified study in references.yml.'
    accessibility: Table version for screen readers.
