    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - State the usual assumption about the situation.
      - Write a deliberately impossible or reversed statement and mark it PO.
      - Do not judge the statement; ask what it would lead to (movement).
      - Note every practical idea that the movement produced.
      - Drop the provocation and keep the ideas.
    time_min: 15
    group_size: 1–5
    materials:
      - paper or board
    units:
      - U2
      - U3
    evidence: untested
    accessibility: Works orally or in writing.
