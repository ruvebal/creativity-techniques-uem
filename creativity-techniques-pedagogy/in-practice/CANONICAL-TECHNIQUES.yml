    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Pick one existing product, service or artefact.
      - Work through the prompt letters one at a time - substitute, combine, adapt, modify, put to another use,
        eliminate, rearrange or reverse.
      - Write at least one change for every prompt, even a weak one.
      - Mark the three changes that most alter how the thing is used.
      - Sketch one of them.
