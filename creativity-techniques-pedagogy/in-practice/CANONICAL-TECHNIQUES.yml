    family: selection
    mode: convergent
    primary_source: gap
    gap_work: Amabile 1982 (manifest key amabile-1982)
    source_status: gap
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Collect anonymous outputs from the same task.
      - Each peer judge rates every output on creativity with their own understanding of the word, on a 1–5 scale.
      - Judges work independently and do not discuss.
      - Average the ratings per output and check how far judges agreed.
      - Discuss outputs with high disagreement.
