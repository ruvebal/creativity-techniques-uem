  - id: process-trail
    name: Process trail
    family: reflection
    mode: both
    primary_source: gap
    gap_work: course practice (no single source); related verified idea in eckersall-2017, 15
    source_status: gap
    catalogue_records:
      - urn:in-practice:exercise:a073813313fed5939b6194af
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Save every version, sketch and discarded idea with a date.
      - Arrange them in order on one page or board.
      - Mark the divergent and convergent moves.
      - Write one paragraph on the turning point.
    time_min: 20
    group_size: individual
    materials:
      - folder
      - board or slide
    units:
      - U1
      - U5
    evidence: untested
    accessibility: Digital trail accepted.
  - id: open-monitoring-warm-up
    name: Open-monitoring warm-up
    family: embodied
    mode: divergent
    primary_source: colzato-2012
    source_locator: p. 1
    source_status: verified
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Sit comfortably; eyes open or closed as preferred.
      - For three minutes, notice whatever thoughts, sounds or sensations come, without holding on to any.
      - Gently return to open noticing when you get caught in one thought.
      - Move straight into a divergent task.
    time_min: 3
    group_size: whole class
    materials:
      - timer
    units:
      - U2
      - U6
    evidence: 'Colzato, Ozturk and Hommel 2012, 1: open-monitoring meditation promoted divergent thinking.'
    accessibility: Opt-out - students may sit quietly or start the task early; no instruction about posture or breathing
      is required.
  - id: bodystorming
    name: Bodystorming
    family: embodied
    mode: divergent
    primary_source: gap
    gap_work: attribution unverified
    source_status: gap
    catalogue_records: []
    steps_basis: classroom adaptation in course wording; not quoted from, and not a claim about, the source
    steps:
      - Set up a rough version of the place where the idea would be used.
      - Act out the user's steps with simple props.
      - Pause when something feels awkward and note it.
      - Change one thing and act it out again.
    time_min: 30
    group_size: 3–6
    materials:
      - simple props
      - space
    units:
      - U3
      - U4
    evidence: untested
    accessibility: Opt-out - students may direct, observe or narrate instead of acting; seated version allowed.
