    unit: U3
    ra: RA14
    type: case
    bloom: apply
    stem: You have just made the second version of a chair model. Write the three checkpoint lines that idea 6 asks for.
    answer: 'What changed, what stayed, and what the change taught you — for example: "seat lowered; legs unchanged; lower felt friendlier but tipped back."'
    ref: schon-1983
    where: Masterclass idea 6 (Reflect at checkpoints)
    anchor: masterclass
