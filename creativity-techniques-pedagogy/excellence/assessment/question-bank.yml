    bloom: analyse
    stem: In U3 Exercise 1 you ask a classmate for feedback only when all three versions exist. Analyse why the exercise orders it this way.
    answer: It is parallel prototyping — critique on several prototypes at once rather than after each one; in the study by Dow and colleagues this led to better-performing and more varied designs.
