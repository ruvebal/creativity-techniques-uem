    type: mcq
    bloom: understand
    stem: Why does U3 Exercise 1 start the same problem from three different entry points?
    answer: Because a different entry point will usually mean a different train of ideas.
    distractors:
      - To split the work among teammates.
      - To save time on the problem.
      - Because the brief asks for three products.
