# Knowledge-test question bank — Creativity Techniques, U1–U3 (PHASE-EX10). PRIVATE: never publish.
#
# STATUS: DRAFT under AUTOPILOT §2 (EX10 row) — approved_by: autopilot (drafts — not for use
# before professor approval). See APPROVAL.md. Not for any exam or graded use until the
# professor approves the bank.
#
# Rules (PHASE-EX10, executor brief):
# - Every answer is derivable from the student-visible lesson text of its unit (Masterclass,
#   Lab or Conclusion) and the verified cite that sentence carries. `ref` is the
#   docs/_data/references.yml key whose page supports the answer; a course-method question
#   uses the verified key cited by the lesson sentence it rests on. No question asks for a
#   page number. Uncited course wording (e.g. the language / medium / support method, the
#   COCD box, the role / look-and-feel / how-it-works question) is not examined here.
# - `ra`: learning outcome code from the Grado en Diseño guía
#   (cv/guides/guia-tecnicas-de-creatividad-diseno-2025-26.json): RA5 solve problems from
#   premises; RA6 pose new problems and solve them autonomously; RA12 understand others'
#   perspectives; RA14 critical, creative and reflective thinking; RA15 group dynamics.
# - `bloom`: remember | understand | apply | analyse | evaluate | create.
#   apply / analyse / evaluate must put the lesson's rule in a situation that is
#   not that lesson's worked example (EX10 cold review F2). Copying an
#   "In practice" scenario is remember, whatever the label says.
# - `where`: the lesson block that holds the answer; `anchor`: its id on the lesson page.
# - `public_quiz: true`: one of the five questions on the public practice page
#   (docs/practice/en/<unit slug>/, built by scripts/build-practice-quizzes.mjs).
# - `retrieval`: the short recall form shown on the deck's retrieval slide (answer in the
#   slide notes); five per unit. `retrieval_answer` is that notes line without the
#   "N. " prefix. scripts/tests/practice-quizzes.test.mjs keeps slides, questions
#   and answers equal, in order.
# - `drafted`: `local-qwen-edited` = stem started from a local qwen2.5:32b-instruct draft
#   (evidence/EX10/qwen-call-N.response.txt) and was rewritten and checked by hand;
#   `hand` = written by the executor. Every answer was checked against the lesson text and
#   its cited page as recorded in the lesson PROVENANCE_LINE.
schema: ct-question-bank/v1
phase: EX10
status: draft
units:
  U1: { slug: u-1-introduction-creativity, lesson: /lessons/en/creativity-techniques/u-1-introduction-creativity/ }
  U2: { slug: u-2-idea-generation-selection, lesson: /lessons/en/creativity-techniques/u-2-idea-generation-selection/ }
  U3: { slug: u-3-development-solutions, lesson: /lessons/en/creativity-techniques/u-3-development-solutions/ }
questions:
  # ---------------------------------------------------------------- U1
  - id: U1-01
    unit: U1
    ra: RA14
    type: mcq
    bloom: understand
    stem: Most definitions of creativity ask for two things at once. Which two?
    answer: Something new (novelty) and something that matters (value, meaningfulness).
    distractors:
      - Speed and a large quantity of ideas.
      - Natural talent and sudden inspiration.
      - Technical polish and a famous author.
    ref: beghetto-karwowski-2025
    where: Masterclass, opening definition
    anchor: masterclass
    drafted: local-qwen-edited
    retrieval: Most definitions of creativity ask for which two things?
    retrieval_answer: "Something new and something that matters: novelty plus value or meaningfulness (Beghetto and Karwowski 2025, 3)."
  - id: U1-02
    unit: U1
    ra: RA14
    type: short
    bloom: remember
    stem: In the UK national report quoted by Fisher, creative outcomes must be both ___ and ___. Fill the gaps.
    answer: Original and of value.
    ref: fisher-2004
    where: Masterclass, opening definition
    anchor: masterclass
    drafted: hand
  - id: U1-03
    unit: U1
    ra: RA14
    type: case
    bloom: evaluate
    stem: A student presents a striking new logo that ignores the client's brief. Using the unit's working definition, is this creative work yet? Explain.
    answer: Not yet. It has novelty, but the working definition also asks for value or meaning; a new idea that does nothing for the brief is not yet creative work.
    ref: beghetto-karwowski-2025
    where: Masterclass, opening definition
    anchor: masterclass
    drafted: hand
  - id: U1-04
    unit: U1
    ra: RA14
    type: mcq
    bloom: understand
    stem: In Csikszentmihalyi's system of three parts, what is the "field"?
    answer: The people who decide what gets in, such as teachers, clients, curators and critics.
    distractors:
      - A set of rules and symbols, such as the notation a graphic designer has to learn.
      - The person who brings a change the field has not yet accepted.
      - The material or the file that holds the signs of the finished work.
    ref: csikszentmihalyi-1996
    where: Masterclass, "A myth to drop"
    anchor: masterclass
    drafted: local-qwen-edited
    public_quiz: true
  - id: U1-05
    unit: U1
    ra: RA14
    type: short
    bloom: remember
    stem: Name the three parts of the system in which, for Csikszentmihalyi, creativity can be observed.
    answer: Domain, field and person.
    ref: csikszentmihalyi-1996
    where: Masterclass, "A myth to drop"
    anchor: masterclass
    drafted: local-qwen-edited
    retrieval: Name the three parts of Csikszentmihalyi's system.
    retrieval_answer: Domain, field and person (Csikszentmihalyi 1996, chap. 2).
  - id: U1-06
    unit: U1
    ra: RA14
    type: mcq
    bloom: understand
    stem: Which statement matches Craft's point about divergent and convergent thinking?
    answer: The same creative act may involve both divergent and convergent thinking.
    distractors:
      - Divergent and convergent thinking can never occur in the same act.
      - Only convergent thinking counts as creative.
      - Divergent thinking is a talent; convergent thinking is a skill.
    ref: craft-2000
    where: Masterclass idea 1 (Open, then close)
    anchor: masterclass
    drafted: hand
  - id: U1-07
    unit: U1
    ra: RA5
    type: case
    bloom: apply
    stem: For a café menu you try eight type treatments without judging any of them, then keep the two a waiter can read at arm's length. Which move is opening and which is closing?
    answer: Trying eight treatments without judging is opening (divergent thinking); keeping the two that can be read at arm's length is closing (convergent thinking, selecting what fits the brief).
    ref: craft-2000
    where: Masterclass idea 1 (Open, then close)
    anchor: masterclass
    drafted: local-qwen-edited
    public_quiz: true
  - id: U1-08
    unit: U1
    ra: RA14
    type: mcq
    bloom: understand
    stem: Csikszentmihalyi reports that the creative process has traditionally been described in five steps. What does he warn about this framework?
    answer: Taken too literally it gives a severely distorted picture; in real work insight, incubation and evaluation keep interrupting one another.
    distractors:
      - The five steps must always be followed in strict order.
      - Only the insight step matters.
      - The steps describe scientists, not designers.
    ref: csikszentmihalyi-1996
    where: Masterclass idea 1 (Open, then close)
    anchor: masterclass
    drafted: hand
  - id: U1-09
    unit: U1
    ra: RA14
    type: short
    bloom: remember
    stem: Name the four abilities (Guilford's, as Chen summarises them) that creativity tests measure.
    answer: Fluency, flexibility, originality and elaboration.
    ref: chen-2011
    where: Masterclass idea 2 (Four skills that tests measure)
    anchor: masterclass
    drafted: local-qwen-edited
    retrieval: Name the four skills that creativity tests measure.
    retrieval_answer: Fluency, flexibility, originality, elaboration (Chen 2011, 26).
  - id: U1-10
    unit: U1
    ra: RA14
    type: mcq
    bloom: understand
    stem: Which of the four abilities is the ability to produce a large number of ideas or solutions to a problem rapidly?
    answer: Fluency.
    distractors:
      - Flexibility.
      - Originality.
      - Elaboration.
    ref: chen-2011
    where: Masterclass idea 2 (Four skills that tests measure)
    anchor: masterclass
    drafted: hand
    public_quiz: true
  - id: U1-11
    unit: U1
    ra: RA14
    type: case
    bloom: apply
    stem: In the alternative-uses Lab, a student lists 15 uses for a shoe; 12 are kinds of container and 3 are kinds of weapon. Score fluency and flexibility as the Lab counts them.
    answer: Fluency is 15 (the number of uses); flexibility is 2 (the number of kinds of use).
    ref: chen-2011
    where: Lab Exercise 1 (Alternative uses, scored on four skills)
    anchor: lab-exercise-1
    drafted: hand
  - id: U1-12
    unit: U1
    ra: RA14
    type: case
    bloom: analyse
    stem: Student A lists 30 uses for a brick, all of them ways to build walls. Student B lists 12 uses across 6 kinds. Who shows more flexibility, and why?
    answer: Student B. Flexibility counts different kinds of idea (different approaches), not the number of uses; A has high fluency but only one kind.
    ref: chen-2011
    where: Masterclass idea 2 and Lab Exercise 1
    anchor: masterclass
    drafted: hand
  - id: U1-13
    unit: U1
    ra: RA14
    type: mcq
    bloom: understand
    stem: What does Chen's remark about the paper clip warn about?
    answer: Divergent thinking with a paper clip may tell us little about a person's talent in another field, such as music.
    distractors:
      - A paper clip is the wrong object for an alternative-uses test.
      - Divergent thinking cannot be trained.
      - Talent in music predicts talent in design.
    ref: chen-2011
    where: Masterclass idea 3 (A test score is not the whole designer)
    anchor: masterclass
    drafted: hand
    retrieval: What does Chen warn about a high alternative-uses score?
    retrieval_answer: Divergent thinking with a paper clip may tell us little about talent in another field, such as music (Chen 2011, 26).
  - id: U1-14
    unit: U1
    ra: RA5
    type: case
    bloom: evaluate
    stem: A student listed the most uses in the alternative-uses Lab and concludes that they are the most talented designer in the class. Evaluate this conclusion.
    answer: It does not follow. A score like this may say little about talent in a specific field; the lesson asks you to treat the numbers as practice, not a verdict, and a long list does not show which idea serves a real brief.
    ref: chen-2011
    where: Masterclass idea 3 and the Lab Exercise 1 Source line
    anchor: masterclass
    drafted: local-qwen-edited
    public_quiz: true
  - id: U1-15
    unit: U1
    ra: RA6
    type: mcq
    bloom: understand
    stem: According to Schön, how do problems appear in real-world practice?
    answer: They do not present themselves as givens; they must be constructed from situations that are puzzling, troubling and uncertain.
    distractors:
      - As clear givens handed over by the client.
      - As puzzles with one correct answer.
      - Only after a technique has been chosen.
    ref: schon-1983
    where: Masterclass idea 4 (Name the unclear problem first)
    anchor: masterclass
    drafted: local-qwen-edited
    retrieval: For Schön, where do problems in practice come from?
    retrieval_answer: "Not as givens: they are constructed from situations that are puzzling, troubling and uncertain (Schön 1983, 40)."
  - id: U1-16
    unit: U1
    ra: RA6
    type: case
    bloom: apply
    stem: 'A client says: "Make the packaging feel more premium." What do you do before you pick a creativity technique?'
    answer: 'Say what is unclear and frame a problem you can design for — for example, "shoppers cannot tell the refill from the original on the shelf" — because problems are built out of the situation, not handed over.'
    ref: schon-1983
    where: Masterclass idea 4 (Name the unclear problem first)
    anchor: masterclass
    drafted: local-qwen-edited
  - id: U1-17
    unit: U1
    ra: RA6
    type: mcq
    bloom: understand
    stem: Buchanan, following Rittel, says something about every formulation of a wicked problem. What?
    answer: It corresponds to the formulation of a solution — how you state the problem already points to an answer.
    distractors:
      - It has one definitive formulation that every experienced designer in the field would write the same way.
      - It can be solved by testing alone, with no need to state the problem again.
      - It should be left untouched until a finished solution already exists.
    ref: buchanan-1992
    where: Masterclass idea 4 (Name the unclear problem first)
    anchor: masterclass
    drafted: hand
    public_quiz: true
  - id: U1-18
    unit: U1
    ra: RA6
    type: short
    bloom: understand
    stem: According to Csikszentmihalyi, how do problems that are handed to you (presented problems) differ from problems you have to discover?
    answer: Discovered problems take longer to prepare for and to solve.
    ref: csikszentmihalyi-1996
    where: Masterclass idea 4 (Name the unclear problem first)
    anchor: masterclass
    drafted: hand
  - id: U1-19
    unit: U1
    ra: RA14
    type: mcq
    bloom: understand
    stem: When a practitioner reflects while acting, what does Schön say they become?
    answer: A researcher in the practice context, who constructs a new theory of the unique case.
    distractors:
      - A follower of the categories of established technique.
      - A neutral observer who does not act.
      - A manager of other people's ideas.
    ref: schon-1983
    where: Masterclass idea 5 (Techniques are tools, not scripts)
    anchor: masterclass
    drafted: hand
  - id: U1-20
    unit: U1
    ra: RA14
    type: case
    bloom: analyse
    stem: A random-word prompt gives you "umbrella" for a library wayfinding brief, and the word clashes with the brief. What has the technique done, and who decides whether you keep the word?
    answer: The technique has done its job by surprising you; keeping the word is your decision. A method helps you talk with the situation; it does not replace your judgement.
    ref: schon-1983
    where: Masterclass idea 5 (Techniques are tools, not scripts)
    anchor: masterclass
    drafted: local-qwen-edited
  - id: U1-21
    unit: U1
    ra: RA14
    type: mcq
    bloom: understand
    stem: Which issue does Kimbell raise about the claims made for "design thinking"?
    answer: It separates thinking from acting and ignores how different designers' practices are.
    distractors:
      - It was never studied in research on designers.
      - It proves that one method is best for every brief.
      - It is too slow for clients.
    ref: kimbell-2011
    where: Masterclass idea 6 ("Design thinking" talk is debated)
    anchor: masterclass
    drafted: local-qwen-edited
  - id: U1-22
    unit: U1
    ra: RA12
    type: case
    bloom: evaluate
    stem: A museum asks you to facilitate a design-thinking day for its shop staff, and treats that name as a settled method. How do you treat the request, and what do you ask before you agree?
    answer: Treat "design thinking" as a debated label rather than a settled method, and ask which decision the day should help them make, and who will make it.
    ref: kimbell-2011
    where: Masterclass idea 6 ("Design thinking" talk is debated)
    anchor: masterclass
    drafted: local-qwen-edited
  # ---------------------------------------------------------------- U2
  - id: U2-01
    unit: U2
    ra: RA14
    type: short
    bloom: understand
    stem: In de Bono's description of the Six Thinking Hats method, what are the two stages of "make the map, then choose a route"?
    answer: First make the map (generate and lay out the options); second, choose a route on the map (select).
    ref: debono-1985
    where: Masterclass idea 1 (Generate, then select)
    anchor: masterclass
    drafted: local-qwen-edited
    retrieval: In de Bono's map image, what are the two stages, in order?
    retrieval_answer: "First make the map, then choose a route on the map: generate, then select (de Bono 1985, 199)."
  - id: U2-02
    unit: U2
    ra: RA14
    type: mcq
    bloom: understand
    stem: In Amabile's classic experiment, what happened to students who expected their artwork to be evaluated?
    answer: Their artworks were judged significantly lower in creativity than those of students who did not expect evaluation.
    distractors:
      - Their artworks were judged more creative.
      - They produced more artworks.
      - There was no difference between the groups.
    ref: amabile-1979
    where: Masterclass idea 1 (Generate, then select)
    anchor: masterclass
    drafted: hand
    retrieval: What happened when students expected evaluation (Amabile)?
    retrieval_answer: Their artworks were judged significantly lower in creativity (Amabile 1979, 221).
  - id: U2-03
    unit: U2
    ra: RA5
    type: case
    bloom: apply
    stem: Your team plans to criticise each poster idea the moment it is spoken, in one ten-minute session. Using idea 1, what change do you propose and why?
    answer: Separate the two jobs — generate first without judging, then select — because doing both in the same minute weakens both, and expecting evaluation lowered judged creativity in Amabile's experiment.
    ref: amabile-1979
    where: Masterclass idea 1 (Generate, then select)
    anchor: masterclass
    drafted: local-qwen-edited
  - id: U2-04
    unit: U2
    ra: RA14
    type: mcq
    bloom: understand
    stem: In the small laboratory study cited in idea 1, which kind of meditation helped people on a divergent-thinking task?
    answer: Open-monitoring meditation (noticing whatever comes, without fixing on one thing).
    distractors:
      - Focused-attention meditation, which keeps attention fixed on one chosen object.
      - Walking meditation practised outdoors for the whole of the session.
      - No meditation at all, only a rest of the same length before the task.
    ref: colzato-2012
    where: Masterclass idea 1 (Generate, then select)
    anchor: masterclass
    drafted: hand
    public_quiz: true
  - id: U2-05
    unit: U2
    ra: RA14
    type: short
    bloom: understand
    stem: The optional U2 warm-up lasts 3 minutes. Why does the lesson call this version untested?
    answer: The study behind it used sessions of about 35 minutes, so a 3-minute version has not been tested.
    ref: colzato-2012
    where: Lab Exercise 1, Source line
    anchor: lab-exercise-1
    drafted: hand
  - id: U2-06
    unit: U2
    ra: RA14
    type: mcq
    bloom: remember
    stem: 'Complete de Bono''s distinction: "Lateral thinking is generative. Vertical thinking is …"'
    answer: Selective.
    distractors:
      - Playful.
      - Private.
      - Visual.
    ref: debono-1970
    where: Masterclass idea 2 (Fluency with flexibility)
    anchor: masterclass
    drafted: hand
  - id: U2-07
    unit: U2
    ra: RA5
    type: case
    bloom: apply
    stem: For a night-bus poster you have fifteen headlines, all puns on the route name. Describe their fluency and flexibility, and say how you could add kinds.
    answer: High fluency but only one kind (low flexibility). Add different kinds of idea, for example a photograph, a diagram, or a question addressed to the rider.
    ref: csikszentmihalyi-1996
    where: Masterclass idea 2 (Fluency with flexibility)
    anchor: masterclass
    drafted: local-qwen-edited
    public_quiz: true
  - id: U2-08
    unit: U2
    ra: RA14
    type: mcq
    bloom: understand
    stem: What "fixation" effect does Cross report, following Jansson and Smith?
    answer: Showing people an example solution makes their own designs copy its features.
    distractors:
      - Designers drop their first concept as soon as problems appear in it.
      - Seeing an example always makes the next designs more original than the example.
      - Fixation of this kind affects only people who are just beginning.
    ref: cross-2006
    where: Masterclass idea 3 (Get past the obvious)
    anchor: masterclass
    drafted: local-qwen-edited
    public_quiz: true
  - id: U2-09
    unit: U2
    ra: RA14
    type: short
    bloom: understand
    stem: According to the studies of designers that Cross reports, what do designers tend to do with their principal solution concept when problems appear?
    answer: They hang on to it.
    ref: cross-2006
    where: Masterclass idea 3 (Get past the obvious)
    anchor: masterclass
    drafted: hand
  - id: U2-10
    unit: U2
    ra: RA15
    type: mcq
    bloom: remember
    stem: What is Osborn's first ground rule for an idea session?
    answer: Criticism must be withheld until all ideas are in.
    distractors:
      - Wild ideas are removed first.
      - Each person speaks only once.
      - The leader judges each idea as it comes.
    ref: osborn-1942
    where: Masterclass idea 3 (Get past the obvious)
    anchor: masterclass
    drafted: hand
    retrieval: What is Osborn's first ground rule for an idea session?
    retrieval_answer: Criticism must be withheld until all ideas are in (Osborn 1942, chap. 4).
  - id: U2-11
    unit: U2
    ra: RA14
    type: short
    bloom: understand
    stem: What danger does Norman name for designers early in the process?
    answer: Becoming fixated on one or two ideas too early; his advice is to generate numerous ideas.
    ref: norman-2013
    where: Masterclass idea 3 (Get past the obvious)
    anchor: masterclass
    drafted: hand
    retrieval: What does Norman warn about one or two early ideas?
    retrieval_answer: Becoming fixated on one or two ideas too early; generate numerous ideas (Norman 2013, 226).
  - id: U2-12
    unit: U2
    ra: RA5
    type: case
    bloom: apply
    stem: You are designing a festival ticket and your first ideas are the date and a logo. What do you do next, and what risk are you avoiding?
    answer: Keep generating past the obvious before you judge — for example until a fold, a texture or a second colour appears — instead of becoming fixated on the first one or two ideas.
    ref: norman-2013
    where: Masterclass idea 3 (Get past the obvious)
    anchor: masterclass
    drafted: hand
  - id: U2-13
    unit: U2
    ra: RA14
    type: mcq
    bloom: understand
    stem: What does de Bono's line "You cannot dig a hole in a different place by digging the same hole deeper" argue for?
    answer: Looking for alternatives instead of accepting, and pushing harder on, the most obvious approach.
    distractors:
      - Working harder on the first idea until it succeeds.
      - Dropping the brief when it gets difficult.
      - Judging ideas as early as possible.
    ref: debono-1970
    where: Masterclass idea 3 (Get past the obvious)
    anchor: masterclass
    drafted: hand
  - id: U2-14
    unit: U2
    ra: RA15
    type: mcq
    bloom: remember
    stem: In de Bono's Six Thinking Hats, what does the black hat cover?
    answer: The negative aspects — why it cannot be done (caution).
    distractors:
      - The feelings people already have about the idea, before any argument.
      - The new ideas that nobody in the group has said yet.
      - The running of the process, including who speaks and when.
    ref: debono-1985
    where: Lab Exercise 2, Source line (and Masterclass idea 4)
    anchor: lab-exercise-2
    drafted: hand
    retrieval: In Six Thinking Hats, what does the black hat cover?
    retrieval_answer: "The negative aspects: why it cannot be done (de Bono 1985, 32)."
  - id: U2-15
    unit: U2
    ra: RA15
    type: case
    bloom: apply
    stem: While choosing a chair for a clinic waiting room, one teammate only lists risks and the others only pitch. How could a hats round restructure the session?
    answer: Everyone thinks in one mode at a time — a few minutes of yellow hat (why each chair could work) for everyone, then a few minutes of black hat (why each could fail) for everyone — so caution arrives from all sides at once and the first voice does not narrow the rest.
    ref: debono-1985
    where: Masterclass idea 4 and Lab Exercise 2
    anchor: masterclass
    drafted: local-qwen-edited
  - id: U2-16
    unit: U2
    ra: RA14
    type: mcq
    bloom: understand
    stem: What did one line of studies find about "what if?" (counterfactual) thinking?
    answer: It helped people link given ideas but hurt the generation of new ones.
    distractors:
      - It always improved the generation of brand-new ideas from a blank page.
      - It had no measurable effect on either linking ideas or generating new ones.
      - It hurt the linking of given ideas but helped the generation of new ones.
    ref: wong-2009
    where: Masterclass idea 4 (Role and constraint tools)
    anchor: masterclass
    drafted: hand
    public_quiz: true
  - id: U2-17
    unit: U2
    ra: RA5
    type: case
    bloom: analyse
    stem: Your team must produce brand-new poster concepts from a blank page. Would you lead with "what if?" prompts? Analyse, using idea 4.
    answer: Use them with care. "What if?" thinking makes people consider alternatives, but in one line of studies it helped link given ideas and hurt the generation of new ones, so it suits combining existing ideas better than starting from nothing.
    ref: wong-2009
    where: Masterclass idea 4 (Role and constraint tools)
    anchor: masterclass
    drafted: hand
  - id: U2-18
    unit: U2
    ra: RA14
    type: short
    bloom: understand
    stem: According to Raymond, what makes a truly great tool, beyond being useful in the expected way?
    answer: It lends itself to uses you never expected.
    ref: raymond-2001
    where: Masterclass idea 4 (Role and constraint tools)
    anchor: masterclass
    drafted: hand
  - id: U2-19
    unit: U2
    ra: RA14
    type: mcq
    bloom: understand
    stem: What does Persaud say gets far less attention than the production of ideas?
    answer: The process by which ideas are critically evaluated, selected, altered or dismissed.
    distractors:
      - The number of ideas produced.
      - The speed of production.
      - The talent of the person who produces them.
    ref: persaud-2007
    where: Masterclass idea 5 (Name selection criteria)
    anchor: masterclass
    drafted: hand
  - id: U2-20
    unit: U2
    ra: RA5
    type: case
    bloom: apply
    stem: You are choosing among three night-bus poster layouts. A teammate says taste is enough, because editing shows taste. What do you write down before you pick, and why is taste not enough?
    answer: Write the selection criterion first — for example, readable at three metres, one route number — then compare every layout against it. A line on editing as a show of taste is not a substitute for writing the criterion down; unstated criteria favour whatever the room already leaned toward.
    ref: rubin-2023
    where: Masterclass idea 5 (Name selection criteria)
    anchor: masterclass
    drafted: hand
  - id: U2-21
    unit: U2
    ra: RA15
    type: case
    bloom: evaluate
    stem: After a packaging workshop a teammate points at eighteen sketches and says the session clearly produced better ideas because there are so many. Evaluate the claim.
    answer: Not shown. A workshop produces material you did not have before; whether it is better must be judged against the brief. The dimensions most workshops try to raise (fluency, flexibility, originality) are not the same thing as better ideas.
    ref: csikszentmihalyi-1996
    where: Masterclass idea 6 (Workshops are means, not genius)
    anchor: masterclass
    drafted: local-qwen-edited
    public_quiz: true
  - id: U2-22
    unit: U2
    ra: RA15
    type: mcq
    bloom: understand
    stem: In the U2 selection Lab, what do the silent dot stickers (the "heat map") mark?
    answer: The interesting parts of ideas; voting is a separate, later step.
    distractors:
      - The single idea the team will build.
      - Ideas that should be dropped.
      - Who wrote each idea.
    ref: knapp-2016
    where: Lab Exercise 2, Source line
    anchor: lab-exercise-2
    drafted: hand
  - id: U2-23
    unit: U2
    ra: RA14
    type: mcq
    bloom: understand
    stem: What does the practitioner counterpoint in idea 6 say about any method?
    answer: The only practice that matters is the one you keep doing; test a method on yourself rather than copying it.
    distractors:
      - Copy the method of a famous artist exactly.
      - A good workshop produces landmark work on command.
      - Practice matters less than talent.
    ref: rubin-2023
    where: Masterclass idea 6 (Workshops are means, not genius)
    anchor: masterclass
    drafted: hand
  - id: U2-24
    unit: U2
    ra: RA14
    type: case
    bloom: understand
    stem: In a D1 defence a classmate uses "imagination", "fantasy" and "creativity" as one and the same word. What does the U2 Conclusion suggest you ask?
    answer: Ask them to tell the terms apart. Hüppauf and Wulf treat imagination, fantasy and creativity as related terms that still need to be told apart.
    ref: huppauf-wulf-2009
    where: Conclusion
    anchor: conclusion
    drafted: hand
  # ---------------------------------------------------------------- U3
  - id: U3-01
    unit: U3
    ra: RA14
    type: mcq
    bloom: understand
    stem: According to the sprint handbook cited in U3, what is a prototype meant to do?
    answer: Answer questions — so keep it focused and build just enough to learn.
    distractors:
      - Impress the client with a finished look.
      - Replace testing with real people.
      - Show every feature at once.
    ref: knapp-2016
    where: Masterclass idea 1 (Make it rough, make it early)
    anchor: masterclass
    drafted: local-qwen-edited
    retrieval: What is a prototype for, says the sprint handbook?
    retrieval_answer: Answer questions, so keep it focused (Knapp, Zeratsky, and Kowitz 2016, chap. 13).
  - id: U3-02
    unit: U3
    ra: RA5
    type: case
    bloom: apply
    stem: For a ticket barrier, what rough prototype could you make first, and what should it do for you?
    answer: For example, tape a paper gate at waist height and watch whether people duck, before any drawing; it should reveal one thing you do not yet know (a question in material form), not look finished.
    ref: knapp-2016
    where: Masterclass idea 1 (Make it rough, make it early)
    anchor: masterclass
    drafted: local-qwen-edited
  - id: U3-03
    unit: U3
    ra: RA6
    type: short
    bloom: understand
    stem: In Cross's summary of design ability, what kind of problems do designers resolve, and with what kind of strategies?
    answer: Ill-defined problems, using solution-focused strategies.
    ref: cross-2006
    where: Masterclass idea 1 (Make it rough, make it early)
    anchor: masterclass
    drafted: hand
  - id: U3-04
    unit: U3
    ra: RA5
    type: case
    bloom: apply
    stem: Your first menu typeface looks clumsy and you want to bin it. What do you do before anyone calls it wrong?
    answer: Protect a short space for variation — for example five more minutes of development — with no criticism, including your own; then judge it with a named criterion.
    ref: osborn-1942
    where: Masterclass idea 2 (Defer judgement so ideas can evolve)
    anchor: masterclass
    drafted: local-qwen-edited
  - id: U3-05
    unit: U3
    ra: RA14
    type: mcq
    bloom: understand
    stem: In the experiment cited in U3 idea 2, college students made artworks. Whose work was judged less creative?
    answer: The work of those who expected to be evaluated.
    distractors:
      - The work of those who did not expect evaluation.
      - The work of those who worked in groups.
      - The work of those who had more time.
    ref: amabile-1979
    where: Masterclass idea 2 (Defer judgement so ideas can evolve)
    anchor: masterclass
    drafted: hand
    public_quiz: true
  - id: U3-06
    unit: U3
    ra: RA14
    type: mcq
    bloom: understand
    stem: Dow and colleagues name a risk of iteration. Which one?
    answer: Fixation — continuously refining one option without considering others.
    distractors:
      - Iteration always wastes time.
      - Iteration stops ideas from improving.
      - Iteration makes ideas too varied to compare.
    ref: dow-2010
    where: Masterclass idea 3 (Iterate with an exit)
    anchor: masterclass
    drafted: local-qwen-edited
    retrieval: What risk of iteration do Dow and colleagues name?
    retrieval_answer: "Fixation: continuously refining one option without considering others (Dow et al. 2010, 18:1)."
  - id: U3-07
    unit: U3
    ra: RA5
    type: case
    bloom: apply
    stem: You are revising a museum label. Write a test question that gives the iteration an exit, and say when you stop.
    answer: For example, "Can a visitor read the artist's name from one step back?" — stop revising once they can, even if another improvement is possible.
    ref: dow-2010
    where: Masterclass idea 3 (Iterate with an exit)
    anchor: masterclass
    drafted: local-qwen-edited
  - id: U3-08
    unit: U3
    ra: RA14
    type: mcq
    bloom: understand
    stem: In the study by Dow and colleagues, novice designers made several prototypes in parallel before critique, compared with critique after each single prototype. What did the parallel group do?
    answer: They produced better-performing and more varied designs, and reported a larger gain in confidence at this kind of task.
    distractors:
      - They produced fewer but more polished designs.
      - They performed the same as the other group.
      - They lost confidence because of the extra work.
    ref: dow-2010
    where: Lab Exercise 1, Source line
    anchor: lab-exercise-1
    drafted: hand
  - id: U3-09
    unit: U3
    ra: RA5
    type: case
    bloom: analyse
    stem: Student A makes one prototype, gets feedback, revises, and repeats three times. Student B makes three different prototypes and gets feedback on all three at once. Which one is parallel prototyping, and what did the study find?
    answer: Student B. In the study, the parallel group produced better-performing and more varied designs (and reported a larger gain in confidence) than the group that got critique after each single prototype.
    ref: dow-2010
    where: Lab Exercise 1, Source line
    anchor: lab-exercise-1
    drafted: local-qwen-edited
    public_quiz: true
  - id: U3-10
    unit: U3
    ra: RA14
    type: mcq
    bloom: remember
    stem: 'Complete Cross: "Sketching enables exploration of the problem space and the solution space to …"'
    answer: Proceed together.
    distractors:
      - Remain separate.
      - Be skipped.
      - Be replaced by words.
    ref: cross-2006
    where: Masterclass idea 4 (Sketch to think)
    anchor: masterclass
    drafted: hand
    retrieval: Sketching explores which two spaces together (Cross)?
    retrieval_answer: The problem space and the solution space (Cross 2006, 37).
  - id: U3-11
    unit: U3
    ra: RA5
    type: case
    bloom: apply
    stem: For a course timetable, how should you sketch, and what do you compare?
    answer: Sketch three different arrangements of the same content (for example a day column, a room-by-room grid, and a path through the building) rather than one polished drawing, then compare what each one puts first.
    ref: cross-2006
    where: Masterclass idea 4 (Sketch to think)
    anchor: masterclass
    drafted: hand
  - id: U3-12
    unit: U3
    ra: RA6
    type: mcq
    bloom: understand
    stem: Why does U3 idea 5 suggest reframing an unclear brief as two or three questions?
    answer: Every formulation of a wicked problem corresponds to the formulation of a solution, so each framing points to a different answer.
    distractors:
      - More questions mean less work later.
      - The client will pick the best question.
      - A wicked problem has one correct formulation.
    ref: buchanan-1992
    where: Masterclass idea 5 (Open the solution space)
    anchor: masterclass
    drafted: hand
    retrieval: Why reframe an unclear brief as two or three questions?
    retrieval_answer: Every formulation of a wicked problem corresponds to the formulation of a solution, so each framing points to a different answer (Buchanan 1992, 16).
  - id: U3-13
    unit: U3
    ra: RA6
    type: case
    bloom: apply
    stem: Reframe the brief "promote the library" as two questions, and say what you would make for each.
    answer: For example, "How do we show the opening hours?" and "How do we show who it is for?" — one small poster sketch for each.
    ref: buchanan-1992
    where: Masterclass idea 5 (Open the solution space)
    anchor: masterclass
    drafted: local-qwen-edited
    public_quiz: true
  - id: U3-14
    unit: U3
    ra: RA6
    type: short
    bloom: understand
    stem: How do Beghetto and Karwowski define creative agency?
    answer: The capacity to envision and enact new and meaningful actions within the existing constraints of a particular context.
    ref: beghetto-karwowski-2025
    where: Masterclass idea 5 (Open the solution space)
    anchor: masterclass
    drafted: hand
  - id: U3-15
    unit: U3
    ra: RA14
    type: mcq
    bloom: understand
    stem: In Schön's account of design as a conversation, what does the situation do?
    answer: It "talks back", and the designer responds; in a good process of design this conversation is reflective.
    distractors:
      - It stays fixed while the designer acts.
      - It chooses the solution for the designer.
      - It is set aside until the end of the project.
    ref: schon-1983
    where: Masterclass idea 6 (Reflect at checkpoints)
    anchor: masterclass
    drafted: hand
    retrieval: For Schön, what does the situation do as you design?
    retrieval_answer: It talks back, and you respond; in a good design process that conversation is reflective (Schön 1983, 79).
  - id: U3-16
    unit: U3
    ra: RA14
    type: case
    bloom: apply
    stem: You have just made the second version of a poster. Write the three checkpoint lines idea 6 asks for.
    answer: 'What changed, what stayed, and what the change taught you — for example: "headline enlarged; colours unchanged; larger type was easier to read from the door but crowded the date."'
    ref: schon-1983
    where: Masterclass idea 6 (Reflect at checkpoints)
    anchor: masterclass
    drafted: local-qwen-edited
  - id: U3-17
    unit: U3
    ra: RA14
    type: mcq
    bloom: understand
    stem: Why does U3 Exercise 1 start the same problem from three different entry points?
    answer: Because a different entry point will usually mean a different train of ideas.
    distractors:
      - To split the remaining work evenly among the teammates on the brief.
      - To save time by starting from a shorter statement of the problem.
      - Because the written brief itself asks the team for three separate products.
    ref: debono-1970
    where: Lab Exercise 1, Source line
    anchor: lab-exercise-1
    drafted: hand
    public_quiz: true
  - id: U3-18
    unit: U3
    ra: RA5
    type: case
    bloom: analyse
    stem: In U3 Exercise 1 you ask a classmate for feedback only when all three versions exist. Analyse why the exercise orders it this way.
    answer: It is parallel prototyping — critique on several prototypes at once rather than after each one; in the study by Dow and colleagues this led to better-performing and more varied designs.
    ref: dow-2010
    where: Lab Exercise 1 (steps 4–5 and Source line)
    anchor: lab-exercise-1
    drafted: hand
  - id: U3-19
    unit: U3
    ra: RA5
    type: case
    bloom: evaluate
    stem: Your revised version passes its test question, but you can see one more improvement. Following idea 3, do you keep revising? Justify.
    answer: No — exit when the test passes, even if another improvement is possible; continuing risks fixation, refining one option without considering others.
    ref: dow-2010
    where: Masterclass idea 3 and Lab Exercise 2 step 7
    anchor: masterclass
    drafted: local-qwen-edited
    public_quiz: true
  - id: U3-20
    unit: U3
    ra: RA6
    type: case
    bloom: analyse
    stem: Idea 5 calls reframing "a bounded way to move from creative potential to creative action". Using the definition of creative agency, explain why the constraints of the context matter.
    answer: Creative agency means envisioning and enacting new and meaningful actions within the existing constraints of a particular context; the constraints are part of the definition, so reframed questions must stay inside the brief's real limits.
    ref: beghetto-karwowski-2025
    where: Masterclass idea 5 (Open the solution space)
    anchor: masterclass
    drafted: hand
  - id: U3-21
    unit: U3
    ra: RA15
    type: case
    bloom: evaluate
    stem: In a team critique, a teammate shoots down every first sketch at once. Evaluate the habit using U3 idea 2.
    answer: It risks closing paths before they show what they might become. Osborn's rule withholds criticism until all ideas are in, and in Amabile's experiment expected evaluation lowered judged creativity; protect a short space for variation, then judge with a named criterion.
    ref: osborn-1942
    where: Masterclass idea 2 (Defer judgement so ideas can evolve)
    anchor: masterclass
    drafted: hand
  - id: U3-22
    unit: U3
    ra: RA14
    type: case
    bloom: apply
    stem: A teammate wants the first model of a ticket barrier to show every feature and look finished, so the client is impressed. What does the sprint handbook say to do instead?
    answer: Keep it focused and build just enough to learn. A prototype is meant to answer questions, not to show every feature or look finished.
    ref: knapp-2016
    where: Masterclass idea 1 (Make it rough, make it early)
    anchor: masterclass
    drafted: hand
