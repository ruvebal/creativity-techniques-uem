# PHASE-EX6 research manifest — Creativity Techniques, U1–U3 + master lecture.
# Generated 2026-10-05 (autopilot; AUTOPILOT.md §2 EX6 rule: only works already
# in the library or legitimately open access are ingested; everything else is a gap).
#
# status: verified = the claim is page- or section-verified against the copy in
#           the library (Ahmes node ids in the lesson's PROVENANCE_LINE) and the
#           work is cited in the listed unit(s) through docs/_data/references.yml.
#         gap      = no verified claim in student text. Either the work is not in
#           the library, or it is held but no page-verified claim was placed.
#           Gaps appear only in the unit's professor brief (PROFESSOR.md §8).
# unit:   units whose lesson cites the work (U1, U2, U3, ML = master lecture).
# provenance: lesson file + PROVENANCE_LINE claim ids.
# page_basis: printed (folio read from the page) | section (EPUB/e-text without
#           print pages: chapter or section locator).
# Internal file: not published (creativity-techniques-pedagogy/ is excluded from Pages).

lessons:
  U1: docs/lessons/en/creativity-techniques/u-1-introduction-creativity/index.md
  U2: docs/lessons/en/creativity-techniques/u-2-idea-generation-selection/index.md
