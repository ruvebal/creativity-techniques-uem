id: parallel-prototyping
title: Parallel Prototyping
technique_id: parallel-prototyping
status: pilot
categories:
- urn:in-practice:concept:prototyping
- family:development
fieldlex:
- ct:prototyping
- ct:divergentConvergentRhythm
units:
- U3
- U5
summary: >-
  Make three quick prototypes side by side before anyone gives feedback, then two more, then a
  final. In the source study, designers who worked this way produced better and more varied
  results, and felt more confident, than designers who refined one prototype at a time.
time_min: 70
group: individual makers, with a peer giving feedback
materials:
- one short brief (poster, banner, screen, label, or similar)
- paper or a simple design tool
- timer
- feedback cards (one line of description per prototype, no ranking)
requirements:
- Prototypes must be rough — about ten minutes each.
- Feedback describes what a prototype does; it does not say which one is best.
- Keep every prototype, numbered in the order made.
accessibility: >-
  Any medium is valid (paper, slides, Figma, cardboard). Feedback may be written on cards instead
  of spoken. The session can be split across two classes: three prototypes and feedback in one,
  the rest in the next.
steps:
- Read the brief. Set a timer and make three different prototypes, about ten minutes each. Do not stop to polish.
- Swap with a peer. They write one descriptive feedback line on each of the three (about five minutes).
- Make two more prototypes (ten minutes each), using what you learned from all three.
- Get one feedback line on each of the two new ones.
- Make a final version (fifteen minutes). It may combine parts of any earlier prototype.
- Lay all six side by side. Write which earlier prototype the final borrows from, and what you would have missed with only one.
adaptation: >-
  Dow and colleagues ran this structure as a controlled experiment with web banner ads and an
  expert's scripted critique. This classroom version keeps their timings and the 3 → feedback →
  2 → feedback → final structure; peer feedback cards replace the expert critique, and the
  side-by-side reflection is a professor addition.
quote:
  chicago: (Dow et al. 2010, 18:5)
  verbatim: >-
    The experiment employed a between-subjects design with one independent variable: the structure
    of the prototyping process. The study held constant the number of prototypes created, the amount
    of feedback provided, and the overall time allotted. In the parallel condition, participants
    created 3 prototypes and got feedback, then made 2 more and got more feedback, and then made a
    final version. In the serial condition, participants created 5 prototypes in a series, received
    feedback after each prototype, then made a final version. Parallel participants were instructed
    to start subsequent prototypes at the same intervals as serial participants.
  ref_key: dow-2010
portfolio_trace: >-
  Six numbered prototypes (photos); the five feedback lines; one paragraph tracing what the final borrows.
judged_by: Portfolio rubric — process transparency; critical analysis and judgement
