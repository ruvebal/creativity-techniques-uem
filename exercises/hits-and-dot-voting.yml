id: hits-and-dot-voting
title: Hits and dot voting
urn: urn:in-practice:exercise:c478dad9bd877b62478ffbf9
technique_id: hits-dot-voting
status: ready
categories:
- urn:in-practice:concept:selection
- family:selection
fieldlex: []
units:
- U2
- U4
summary: Mark interesting parts in silence before you debate. Hits gather heat; a later vote decides —
  without groupthink in the first pass.
time_min: 15
group: 3–10
materials:
- idea sheets on a wall or board
- dot stickers
- optional digital whiteboard
requirements:
- Ideas must already be visible (one per sheet).
- No talking during the heat-map pass.
accessibility: Digital whiteboard voting; allow seated access to the wall.
steps:
- Put all ideas on the wall, one per note or sheet.
- Read in silence; each person places small dots on parts that look strong (hits).
- Each person then gets one larger vote for one idea.
- Cluster the dots and read out the top three.
- The decider (or the group) chooses, and records why.
adaptation: Classroom timing and portfolio fields are professor adaptations of the sprint sticky decision
  / heat map sequence.
quote:
  chicago: (Knapp, Zeratsky, and Kowitz 2016, chap. 10)
  verbatim: 'We’ve spent years optimizing our sprint decisions to be as efficient as possible. We ended
    up with a five-step process—and coincidentally, every step involves something sticky: 1. Art museum:
    Put the solution sketches on the wall with masking tape. 2. Heat map: Look at all the solutions in
    silence, and use dot stickers to mark interesting parts. 3. Speed critique: Quickly discuss the highlights
    of each solution, and use sticky notes to capture big ideas. 4. Straw poll: Each person chooses one
    solution, and votes for it with a dot sticker. 5. Supervote: The Decider makes the final decision,
    with—you guessed it—more stickers. This sticky stuff isn’t a gimmick. The dot stickers let us form
    and express our opinions without lengthy debate, and the sticky notes allow us to record big ideas
    without relying on our short-term memory.'
  ref_key: knapp-2016
portfolio_trace: Photo or list of dotted sheets; top three; chosen idea and criterion.
judged_by: Portfolio rubric — critical analysis and judgement
