id: down-draft-up-draft
title: Down Draft, Up Draft
urn: urn:in-practice:exercise:9907f845999151acd44939cf
technique_id: delay-judgement-checkpoint
status: pilot
categories:
- urn:in-practice:concept:divergent-thinking
- family:development
fieldlex:
- ct:divergentConvergentRhythm
- ct:ideaDevelopment
units:
- U3
- U5
summary: >-
  Make the same piece three times with three different jobs: get it down, fix it up, then check
  every detail. Separating the passes stops you from judging work before it exists.
time_min: 40
group: individual, with one peer check
materials:
- the brief or piece you are working on
- paper, sketchbook, or any making tool
- timer
- coloured pen for the third pass
requirements:
- The first pass is not shown to anyone and is not assessed.
- Works for writing, sketches, layouts, storyboards, or code.
- Keep all three versions; do not overwrite the first one.
accessibility: >-
  Any medium is valid. Students who find the timer stressful may use page or frame counts instead.
  The peer check can be written instead of spoken.
steps:
- Down draft (15 minutes). Get everything out, fast and loose. Do not delete, erase, or fix anything. No one will see this.
- Mark the one part of the down draft that surprised you most.
- Up draft (15 minutes). On a fresh page, rebuild the piece around that part. Now you may cut, reorder, and say it more accurately.
- Dental draft (10 minutes). With a coloured pen, check every element of the up draft against the brief. Mark each one keep, fix, or cut.
- Show only the up draft and dental marks to a peer. Ask which mark they would challenge.
adaptation: >-
  Lamott writes about prose drafts and quotes a friend's three-step naming: down draft, up draft,
  dental draft. This classroom version applies the three passes to any design medium, adds
  timings, the "mark what surprised you" bridge between passes, and the peer check. Lamott's own,
  blunter name for the first pass appears in the same chapter.
quote:
  chicago: (Lamott 2007, 12)
  verbatim: >-
    The first draft is the child's draft, where you let it all pour out and then let it romp all
    over the place, knowing that no one is going to see it and that you can shape it later. […]
    Almost all good writing begins with terrible first efforts. You need to start somewhere. Start
    by getting something—anything—down on paper. A friend of mine says that the first draft is the
    down draft—you just get it down. The second draft is the up draft—you fix it up. You try to say
    what you have to say more accurately. And the third draft is the dental draft, where you check
    every tooth, to see if it's loose or cramped or decayed, or even, God help us, healthy.
  ref_key: lamott-2007
