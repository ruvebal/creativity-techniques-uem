summary: >-
  Draw the creases of your own palm for five minutes without looking at the paper. The drawing
  will not look like a hand; that is the point. It trains slow, exact looking and switches off
  the habit of drawing what you think things look like.
time_min: 15
group: individual, then pairs to compare
materials:
- one sheet of paper, taped to the table
- pencil or fine pen
- timer
requirements:
- No drawing skill needed; results are not judged on likeness.
- Tape the paper down before you start so it does not move.
- Keep this pass separate from project work; it is a perception warm-up.
accessibility: >-
  Any complex object can replace the palm (crumpled paper, a leaf, a key) if holding the hand still
  is uncomfortable. Students may sit any way that lets them face away from the paper. A tablet with
  the screen covered works too. Low-vision students can trace a textured object by touch.
steps:
- Tape the paper down. Hold the pencil on it, then turn your body so you face away from the paper.
- Set a timer for five minutes. Rest your other hand somewhere stable and look at the creases in your palm.
- Pick one crease. Move your eyes along it very slowly and let the pencil move at exactly the same speed.
- When the crease meets another line, follow the new line. Do not look at the paper until the timer ends.
- Look at the drawing. With a partner, name one detail you saw that you would normally never notice.
- Write one sentence on how your attention changed between minute one and minute five.
adaptation: >-
  Edwards demonstrates the method and gives it to drawing students as a single five-minute
  exercise. This classroom version keeps her five-minute timer, the palm subject, and the
  no-peeking rule; the partner comparison and the one-sentence attention note are professor
  additions that turn the drawing into evidence for the portfolio.
quote:
  chicago: (Edwards 1999, 90)
  verbatim: >-
    Gaze at a single wrinkle in your palm. Place your pencil on the paper and begin to draw just
    that edge. As your eyes track the direction of the edge very slowly, one millimeter at a time,
    your pencil will record your perceptions. If the edge changes direction, so does your pencil.
    If the edge intersects with another edge, follow that new information slowly with your eyes,
    while your pencil simultaneously records every detail. An important point: Your pencil can
    record only what you see-nothing more, nothing less-at the moment of seeing. Your hand and
    pencil function like a seismograph, responding only to your actual perceptions.
  ref_key: edwards-1999
portfolio_trace: >-
  The contour drawing (photo or scan); one detail you noticed; one sentence on how attention changed.
judged_by: Portfolio rubric — process transparency
graphic:
