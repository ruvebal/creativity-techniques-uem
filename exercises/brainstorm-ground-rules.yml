id: brainstorm-ground-rules
title: Brainstorm Ground Rules
urn: urn:in-practice:exercise:5164a30fda91df45bd76841e
technique_id: brainstorming-osborn
status: pilot
categories:
- urn:in-practice:concept:divergent-thinking
- family:generation
fieldlex:
- ct:brainstorming
- ct:groupDynamics
units:
- U2
summary: >-
  Run a short group idea session under the four original brainstorming rules: no criticism, wild
  ideas welcome, go for quantity, build on others. A rule-keeper calls out any judgement, and
  selection happens only after the session ends.
time_min: 30
group: 4–6, with one scribe and one rule-keeper
materials:
- one specific problem statement, written where everyone can see it
- sticky notes or a shared digital board
- timer
- a card with the four rules
requirements:
- The problem must be narrow enough to aim at (one user, one situation), not a general theme.
- Rotate the rule-keeper and scribe roles so the same people do not always lead.
- International cohorts may contribute in any working language; the scribe writes a short gloss.
accessibility: >-
  Ideas can be spoken, written on notes, or typed into the shared board; quieter students may
  pass notes to the scribe. No movement is required. A silent written round can open the session.
steps:
- Read the four rules aloud, then put them in your own words as a group.
- Write the problem on the board as one specific question.
- For fifteen minutes, call out ideas. The scribe numbers every idea. The rule-keeper says "later" whenever someone judges.
- Every few minutes, the scribe reads two ideas aloud and the group tries to combine or improve them.
- Stop. Count the ideas. Only now sort them, using a separate selection method such as Hits and Dot Voting.
- Note how many times the rule-keeper had to call "later", and what kind of comment it was.
adaptation: >-
  Osborn's rules and the hot-and-cold-water warning are quoted as written. The rule-keeper role,
  the fifteen-minute timing, the combine checkpoint, and the hand-off to a separate selection
  exercise are professor adaptations. Osborn's claims for group sessions have been contested
  since; treat this as a rule-following exercise, not proof that groups always beat individuals.
quote:
  chicago: (Osborn 2013, chap. 26)
  verbatim: >-
    Idea-producing conferences are relatively fruitless unless certain rules are understood by all
    present, and are faithfully followed. Here are four basics: (1) Judicial judgment is ruled out.
    Criticism of ideas must be withheld until later. (2) "Free-wheeling" is welcomed. The wilder the
    idea, the better; it is easier to tame down than to think up. (3) Quantity is wanted. The greater
    the number of ideas, the more the likelihood of winners. (4) Combination and improvement are
    sought. In addition to contributing ideas of their own, participants should suggest how ideas of
    others can be turned into better ideas; or how two or more ideas can be joined into still another
    idea. […] "If you try to get hot and cold water out of the same faucet at the same time, you will
    get only tepid water. And if you try to criticize and create at the same time, you can't turn on
    either cold enough criticism or hot enough ideas. So let's stick solely to ideas—let's cut out
    all criticism during this session."
  ref_key: osborn-2013
