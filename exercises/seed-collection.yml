summary: Collect many small starting points without ranking them. Later, water the ones that still resonate
  — photos, phrases, and sounds all count.
time_min: 20
group: individual or pairs
materials:
- notebook or phone notes
- optional camera for tools/fixtures only (no people)
requirements:
- Do not rank while collecting.
- 'If photographing on campus: tools and fixtures only; no faces or badges.'
accessibility: Voice notes, photos or text all count as seeds.
steps:
- Collect at least five seeds (phrase, sound, image, tool, fixture) in one place.
- Do not compare or rank them while collecting.
- Pick three seeds that still interest you.
- Develop each in a different direction for five minutes.
- Keep the seed that grew most; note why.
adaptation: Compressed class timing; optional Creative Campus tool/fixture photography with a no-people
  rule is a professor adaptation.
quote:
  chicago: (Rubin 2023, 50)
  verbatim: Placing too much emphasis on a seed or dismissing it prematurely can interfere with its natural
    growth. The temptation to insert too much of yourself in this first phase can undermine the entire
    enterprise. Be wary of taking shortcuts or crossing items off your list too quickly. The seed that
    doesn’t get watered cannot reveal its ability to bear fruit. Collect many seeds and then, over time,
    look back and see which ones resonate. Sometimes we’re too close to them to recognize their true potential,
    and other times the magical moment that inspired a seed into existence is bigger than the seed itself.
    It’s generally preferable to accumulate several weeks’ or months’ worth of ideas and then choose which
    of them to focus on, instead of following an urge or obligation to rush to the finish line with what
    is in front of us today.
  ref_key: rubin-2023
portfolio_trace: Five seeds; three developed; one kept with reason; consent note if photos.
judged_by: Portfolio rubric — creative fluency, flexibility, and originality
