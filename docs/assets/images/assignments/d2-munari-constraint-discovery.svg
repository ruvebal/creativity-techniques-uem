<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="munari-plate-title munari-plate-desc">
  <title id="munari-plate-title">Constraint as discovery — Munari</title>
  <desc id="munari-plate-desc">Two-column diagram: open draft shapes pass through a circle-only rule into a tidy disk; beside it, Munari quotes on method, rules, and form.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .kicker { font: 500 14px/1.2 "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #b42318; letter-spacing: 0.2em; text-transform: uppercase; }
      .display { font: 500 46px/1.05 "IBM Plex Serif", Georgia, "Times New Roman", serif; fill: #1a1510; }
      .body { font: 400 20px/1.4 "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #2a241c; }
      .cite { font: 400 15px/1.35 "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #6b6358; }
      .label { font: 500 17px/1.2 "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #1a1510; }
    ]]></style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1a1510" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <!-- Grid: 64 px outer margin; columns 64–772 and 828–1536 (56 px gap); headings share baselines. -->
  <rect width="1600" height="900" fill="#f3eee4"/>

  <!-- Left column: the rule as a diagram -->
  <text class="kicker" x="64" y="92">D2 · One formal rule</text>
  <text class="display" x="64" y="150">One rule</text>
  <text class="display" x="64" y="204">keeps the form</text>
  <text class="display" x="64" y="258">legible.</text>

  <!-- Diagram row centred at y=545, equal 108 px gaps: draft 64–196 · rule 304–544 · reading 652–772 -->
  <text class="label" x="130" y="405" text-anchor="middle">Open draft</text>
  <text class="kicker" x="424" y="405" text-anchor="middle">Rule · circle only</text>
  <text class="label" x="712" y="405" text-anchor="middle">New reading</text>

  <g fill="none" stroke-width="1.8" transform="translate(-11 0)">
    <circle cx="94" cy="484" r="13" stroke="#c44536"/>
    <circle cx="144" cy="476" r="13" stroke="#287668"/>
    <circle cx="194" cy="490" r="13" stroke="#c44536"/>
    <rect x="81" y="533" width="26" height="26" stroke="#1a1510"/>
    <rect x="131" y="526" width="26" height="26" stroke="#287668"/>
    <rect x="181" y="537" width="26" height="26" stroke="#c44536"/>
    <polygon points="94,584 113,614 75,614" stroke="#1a1510"/>
    <polygon points="164,580 184,614 144,614" stroke="#287668"/>
  </g>

  <text class="label" x="250" y="531" text-anchor="middle">Constraint</text>
  <path d="M223 545 H277" stroke="#1a1510" stroke-width="1.6" marker-end="url(#arr)"/>

  <g transform="translate(-14 0)">
  <rect x="318" y="425" width="240" height="240" fill="none" stroke="#c44536" stroke-width="2"/>
  <circle cx="438" cy="545" r="96" fill="none" stroke="#1a1510" stroke-width="2"/>
  <path d="M342 545 A96 96 0 0 1 438 449" fill="none" stroke="#c44536" stroke-width="3"/>
  <path d="M438 449 A96 96 0 0 1 534 545" fill="none" stroke="#287668" stroke-width="3"/>
  <path d="M534 545 A96 96 0 0 1 438 641" fill="none" stroke="#c44536" stroke-width="3"/>
  <circle cx="438" cy="545" r="46" fill="#e8f2ee" stroke="#287668" stroke-width="2"/>
  <circle cx="438" cy="545" r="6" fill="#1a1510"/>
  <g stroke="#1a1510" stroke-width="1.2">
    <line x1="438" y1="449" x2="438" y2="459"/>
    <line x1="521.1" y1="497" x2="512.5" y2="502"/>
    <line x1="521.1" y1="593" x2="512.5" y2="588"/>
    <line x1="438" y1="641" x2="438" y2="631"/>
    <line x1="354.9" y1="593" x2="363.5" y2="588"/>
    <line x1="354.9" y1="497" x2="363.5" y2="502"/>
  </g>
  </g>

  <path d="M571 545 H625" stroke="#1a1510" stroke-width="1.6" marker-end="url(#arr)"/>

  <circle cx="712" cy="545" r="60" fill="#f7f2e8" stroke="#1a1510" stroke-width="2"/>
  <circle cx="712" cy="545" r="44" fill="none" stroke="#287668" stroke-width="1.5"/>
  <circle cx="712" cy="545" r="9" fill="#c44536"/>
  <text class="cite" x="712" y="635" text-anchor="middle">Always oriented</text>

  <text class="cite" x="64" y="836">Constraint narrows support and language so a reading can land.</text>

  <!-- Right column, right-aligned to x=1536: quotes and the closing frame spaced by equal 35 px gaps between the heading rule (y=290) and the bottom margin (y=836) -->
  <text class="kicker" x="1536" y="92" text-anchor="end">Munari on method</text>
  <text class="display" x="1536" y="150" text-anchor="end">Rules do not</text>
  <text class="display" x="1536" y="204" text-anchor="end">block discovery.</text>
  <text class="display" x="1536" y="258" text-anchor="end">They force it.</text>
  <line x1="828" y1="290" x2="1536" y2="290" stroke="#1a1510" stroke-width="1"/>

  <text class="body" text-anchor="end">
    <tspan x="1536" y="345">“Creativity does not mean improvisation without method:</tspan>
    <tspan x="1536" y="373">that way only produces confusion.”</tspan>
  </text>
  <text class="cite" x="1536" y="403" text-anchor="end">Munari 2016, 16 · course translation from Spanish</text>
  <line x1="828" y1="427" x2="1536" y2="427" stroke="#d4cdc0" stroke-width="1"/>

  <text class="body" text-anchor="end">
    <tspan x="1536" y="464">“The rules of the method do not hinder the designer’s</tspan>
    <tspan x="1536" y="492">personality; on the contrary, they stimulate them to</tspan>
    <tspan x="1536" y="520">discover something that may eventually be useful to</tspan>
    <tspan x="1536" y="548">others as well.”</tspan>
  </text>
  <text class="cite" x="1536" y="578" text-anchor="end">Munari 2016, 17 · course translation from Spanish</text>
  <line x1="828" y1="601" x2="1536" y2="601" stroke="#d4cdc0" stroke-width="1"/>

  <text class="body" text-anchor="end">
    <tspan x="1536" y="639">“A disk lying on a flat surface cannot be placed wrongly.</tspan>
    <tspan x="1536" y="667">A circle instead is always tidy.”</tspan>
  </text>
  <text class="cite" x="1536" y="697" text-anchor="end">Munari 2009, sec. opening plate · The Circle</text>

  <!-- Closing frame centred in the column (828–1536 → centre 1182) -->
  <rect x="952" y="738" width="460" height="98" fill="none" stroke="#c44536" stroke-width="1.5"/>
  <text class="body" text-anchor="middle">
    <tspan x="1182" y="780">What the rule removes is as meaningful</tspan>
    <tspan x="1182" y="808">as what it lets the audience read.</tspan>
  </text>
</svg>
