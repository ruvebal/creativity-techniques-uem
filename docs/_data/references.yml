# Single bibliography source for lessons (PHASE-EX6).
#
# One canonical Chicago author-date entry per work, keyed `surname-year`
# (first author; existing two-author keys kept). `year` is the year the cited
# text was first published (reprints and e-book reissues keep the original
# year); `edition_used` names the copy whose pages or sections the lessons cite.
# A revised edition is a new edition and keeps its own year (Raymond 2001,
# Norman 2013).
#
# Lessons list the keys they cite in front matter (`references: [...]`) and
# render the list with the references.html include; in-text
# links are `#ref-<key>`. Only page- or section-verified works belong here;
# unresolved works stay in the professor brief (research-manifest.yml).
# Student-facing data: no internal store names, ids or paths in this file.

amabile-1979:
  sort: "Amabile 1979"
  year: 1979
  edition_used: "Journal article (publisher PDF)."
  chicago: >-
