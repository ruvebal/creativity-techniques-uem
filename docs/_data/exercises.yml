      - U3
      - U6
    summary: Log surprises while you work — when the situation talks back — then name one move you changed.
    time_min: 15
    group: individual
    materials:
      - current making session
      - notebook or voice notes
    requirements:
      - Log during work, not only after polishing.
      - Keep entries short and dated.
    accessibility: Voice notes accepted; no drawing required.
    steps:
      - During a short making pass, note three moments of surprise or resistance.
      - For each, write what the work “said back” (a constraint, a failure, an unexpected fit).
      - Name one strategy you changed in response.
      - Mark whether the change opened or closed options.
      - Keep the log beside the artefact for critique.
    adaptation: >-
      Classroom timing and portfolio fields adapt Schön’s reflective conversation to a short studio
      log.
    quote:
      chicago: (Schön 1983, 79)
      verbatim: >-
        In a good process of design, this conversation with the situation is reflective. In answer
        to the situation’s back-talk, the designer reflects-in-action on the construction of the
        problem, the strategies of action, or the model of the phenomena, which have been implicit
        in his moves. […] But the practitioner’s moves also produce unintended changes which give
        the situations new meanings. The situation talks back, the practitioner listens; and as he
        appreciates what he hears, he reframes the situation once again. When Quist discovers that
        his moves have produced a gallery which is “in a minor way . . . the major thing,” he
        becomes aware of a new whole idea, which sets criteria for the further designing.
      ref_key: schon-1983
    portfolio_trace: Three surprise notes; one changed strategy; open/close mark.
    judged_by: Portfolio rubric — critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/reflection-in-action-log-a8939c48353ca113.svg
      png: /assets/images/exercise-graphics/reflection-in-action-log-a8939c48353ca113.png
      alt: >-
        Making produces a surprise; the student records the situation's response, changes strategy,
        and returns to making.
      caption: >-
        Reflection happens during the work: notice its response, change a move, and see what the new
        move makes possible.
  - id: seed-collection
    title: Seed collection
    technique_id: seed-collection
    status: ready
    categories:
      - urn:in-practice:concept:creative-habits
      - family:generation
    fieldlex: []
    units:
      - U2
      - U4
      - U6
    summary: >-
      Collect many small starting points without ranking them. Later, water the ones that still
      resonate — photos, phrases, and sounds all count.
    time_min: 20
    group: individual or pairs
    materials:
      - notebook or phone notes
      - optional camera for tools/fixtures only (no people)
    requirements:
      - Do not rank while collecting.
      - 'If photographing on campus: tools and fixtures only; no faces or badges.'
    accessibility: Voice notes, photos or text all count as seeds.
    steps:
      - Collect at least five seeds (phrase, sound, image, tool, fixture) in one place.
      - Do not compare or rank them while collecting.
      - Pick three seeds that still interest you.
      - Develop each in a different direction for five minutes.
      - Keep the seed that grew most; note why.
    adaptation: >-
      Compressed class timing; optional Creative Campus tool/fixture photography with a no-people
      rule is a professor adaptation.
    quote:
      chicago: (Rubin 2023, 50)
      verbatim: >-
        Placing too much emphasis on a seed or dismissing it prematurely can interfere with its
        natural growth. The temptation to insert too much of yourself in this first phase can
        undermine the entire enterprise. Be wary of taking shortcuts or crossing items off your list
        too quickly. The seed that doesn’t get watered cannot reveal its ability to bear fruit.
        Collect many seeds and then, over time, look back and see which ones resonate. Sometimes
        we’re too close to them to recognize their true potential, and other times the magical
        moment that inspired a seed into existence is bigger than the seed itself. It’s generally
        preferable to accumulate several weeks’ or months’ worth of ideas and then choose which of
        them to focus on, instead of following an urge or obligation to rush to the finish line with
        what is in front of us today.
      ref_key: rubin-2023
    portfolio_trace: Five seeds; three developed; one kept with reason; consent note if photos.
    judged_by: Portfolio rubric — creative fluency, flexibility, and originality
    graphic:
      svg: /assets/images/exercise-graphics/seed-collection-f86850db985d3d85.svg
      png: /assets/images/exercise-graphics/seed-collection-f86850db985d3d85.png
      alt: >-
        Several unranked starting points are gathered, three are developed in different directions,
        and one is kept with a reason.
      caption: 'Delay ranking: collect broadly, develop a few seeds, then choose what has grown and why.'
  - id: visitor-journey-walkthrough
    title: Visitor Journey Walkthrough
    technique_id: contextual-observation
    status: ready
    categories:
      - urn:in-practice:concept:observation
      - family:framing
    fieldlex: []
    units:
      - U4
    summary: >-
      Walk a Creative Campus route from a first-time visitor’s side. Record actions and words;
      select one prior idea against evidence — not against taste.
    time_min: 20
    group: team; rotate walker, observer, recorder
    materials:
      - prior idea set (e.g. U4.1)
      - agreed public campus route to the Atrium information point
      - route note sheet
    requirements:
      - Do not impersonate a disability or claim to represent a community.
      - Do not record identifiable members of the public.
      - Peer walkthroughs are not visitor research.
    accessibility: Seated route-map walkthrough allowed; mark observed vs imagined parts.
    steps:
      - Agree the Creative Campus route, destination, and a neutral first-time visitor task.
      - >-
        One teammate walks without seeing the idea set; the observer records actions, words, pauses,
        and turns.
      - Switch roles or use a seated map walkthrough if needed.
      - >-
        Compare notes with the idea set; select one idea that responds to a recorded moment; name
        the criterion and one unresolved question.
    adaptation: >-
      Professor adaptation of “Walking in the Customer’s Shoes” to a short Creative Campus route
      with portfolio fields.
    quote:
      chicago: (Michalko 2010, 371)
      verbatim: >-
        Walking in the customer's shoes. In this approach, people turn around to find out what it's
        really like to be someone in a different position. For example, a realtor sent his
        salespeople to car dealerships to help them improve their selling skills. Posing as
        customers, they walked through the entire sales process, recording particular behavior,
        words, and actions that critically affected their attitude as 'buyers.' At the sales
        meeting, they shared their experiences and talked about ways they could improve their own
        selling skills. It was an eye-opening experience that made the salespeople see that it's one
        thing to talk about walking in someone else's shoes—and another to actually do it.
      ref_key: michalko-2010
    portfolio_trace: >-
      Route and task; roles; observation notes; selected idea and criterion; unresolved question;
      limitation note.
    judged_by: Portfolio rubric — critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/visitor-journey-walkthrough-e44ba8aaf1a9170d.svg
      png: /assets/images/exercise-graphics/visitor-journey-walkthrough-e44ba8aaf1a9170d.png
      alt: >-
        A first-time visitor's route yields observed moments; one prior idea is selected against a
        recorded moment and criterion.
      caption: >-
        Choose against what the walkthrough revealed, not against taste; keep the unresolved
        question visible.
