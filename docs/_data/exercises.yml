exercises:
  - id: alternative-uses-task
    title: Alternative Uses Task
    technique_id: alternative-uses-task
    status: ready
    categories:
      - urn:in-practice:concept:divergent-thinking
      - family:generation
    fieldlex:
      - ct:divergentThinking
    units:
      - U1
      - U2
    summary: >-
      List many uses for one ordinary object under a timer. Fluency first; then notice flexibility
      across categories.
    time_min: 15
    group: individual, then shared board
    materials:
      - object or image
      - paper
      - timer
    requirements:
      - One shared prompt object for the class.
      - No judging during the timed list.
    accessibility: Oral or typed lists accepted; image prompt can replace a physical object.
    steps:
      - Show one everyday object (brick, paperclip, shoe) and start a visible timer.
      - Each student lists as many uses as possible in silence.
      - Stop; count the list (fluency).
      - Mark how many different categories appear (flexibility).
      - Share two surprising uses with a neighbour; keep the full list for the portfolio.
    adaptation: >-
      Classroom timing and portfolio fields are course adaptations of the unusual-uses / brick
      prompt reported with Guilford’s abilities.
    quote:
      chicago: (Chen 2011, 40)
      verbatim: >-
        How many uses can you think of for a brick? […] More interestingly, individuals differ
        considerably in terms of the number of answers they can come up with. Some can think of many
        different ways to use a brick, whereas others may be only able to think of one or two. Based
        on the ability of an individual to answer these types of questions, Hudson differentiated
        individuals in terms of two intellectual types: convergers, who would specialize in
        mathematics and physical sciences, and divergers, who are likely to excel in the arts and
        make surprising cognitive leaps.
      ref_key: chen-2011
    portfolio_trace: Timed list; fluency count; flexibility note; two shared uses.
    judged_by: Portfolio rubric — creative fluency, flexibility, and originality
    graphic:
      svg: /assets/images/exercise-graphics/alternative-uses-task-b0831031d42181b2.svg
      png: /assets/images/exercise-graphics/alternative-uses-task-b0831031d42181b2.png
      alt: >-
        One everyday object opens into several kinds of use; each branch adds a different category
        to the idea list.
      caption: >-
        One object can produce many ideas; grouping those ideas shows flexibility as well as
        fluency.
    used_in:
      - /lessons/en/creativity-techniques/u-1-introduction-creativity/
  - id: ask-a-crab
    title: Ask a Crab — picture diverge
    technique_id: brainstorming-osborn
    status: ready
    categories:
      - urn:in-practice:concept:association
      - family:generation
    fieldlex: []
    units:
      - U4
    summary: >-
      Use an unrelated picture to open workplace ideas before you judge. Save the path from image to
      idea — not only the favourite.
    time_min: 20
    group: same team as the U4 idea set
    materials:
      - unrelated picture prompt
      - U4 brief or workplace problem
      - paper
    requirements:
      - Keep generation separate from selection.
      - Record the picture ID or description in the trace.
    accessibility: Large-print or screen images; oral idea lists OK.
    steps:
      - Show one unrelated picture to the team.
      - In a timed pass, each person writes ideas the picture suggests for the workplace brief.
      - Read ideas aloud without ranking them yet.
      - 'Save a short path: picture → association → idea.'
      - Stop before voting; selection belongs to a later exercise.
    adaptation: >-
      Classroom adaptation of Ask a Crab’s early blueprint steps; full five-step source is not
      claimed as the class procedure.
    quote:
      chicago: (Michalko 2010, 440)
      verbatim: >-
        Give each group member a folder containing two or three pictures that are not related to the
        problem area. Read aloud a problem statement and ask the group to verbally brainstorm
        solutions. Instruct the group members to examine each picture and write their ideas. After a
        designated period, ask the group members to read their ideas aloud. As each idea is read,
        ask the group members to discuss it and try to develop new ideas or modifications. Record
        all new ideas as they are suggested.
      ref_key: michalko-2010
    portfolio_trace: Picture note; idea list; one association path; no selection claim.
    judged_by: Portfolio rubric — creative fluency, flexibility, and originality
    graphic:
      svg: /assets/images/exercise-graphics/ask-a-crab-85d8b0fb302f389f.svg
      png: /assets/images/exercise-graphics/ask-a-crab-85d8b0fb302f389f.png
      alt: >-
        An unrelated picture prompts associations, which lead to several workplace ideas without
        choosing a winner.
      caption: Keep the visible path from picture to association to idea; selection happens later.
    used_in:
      - /lessons/en/creativity-techniques/u-4-1-generate-before-you-judge/
  - id: brainstorm-ground-rules
    title: Brainstorm Ground Rules
    technique_id: brainstorming-osborn
    status: pilot
    categories:
      - urn:in-practice:concept:divergent-thinking
      - family:generation
    fieldlex:
      - ct:brainstorming
      - ct:groupDynamics
    units:
      - U2
    summary: >-
      Run a short group idea session under the four original brainstorming rules: no criticism, wild
      ideas welcome, go for quantity, build on others. A rule-keeper calls out any judgement, and
      selection happens only after the session ends.
    time_min: 30
    group: 4–6, with one scribe and one rule-keeper
    materials:
      - one specific problem statement, written where everyone can see it
      - sticky notes or a shared digital board
      - timer
      - a card with the four rules
    requirements:
      - The problem must be narrow enough to aim at (one user, one situation), not a general theme.
      - Rotate the rule-keeper and scribe roles so the same people do not always lead.
      - >-
        International cohorts may contribute in any working language; the scribe writes a short
        gloss.
    accessibility: >-
      Ideas can be spoken, written on notes, or typed into the shared board; quieter students may
      pass notes to the scribe. No movement is required. A silent written round can open the
      session.
    steps:
      - Read the four rules aloud, then put them in your own words as a group.
      - Write the problem on the board as one specific question.
      - >-
        For fifteen minutes, call out ideas. The scribe numbers every idea. The rule-keeper says
        "later" whenever someone judges.
      - >-
        Every few minutes, the scribe reads two ideas aloud and the group tries to combine or
        improve them.
      - >-
        Stop. Count the ideas. Only now sort them, using a separate selection method such as Hits
        and Dot Voting.
      - Note how many times the rule-keeper had to call "later", and what kind of comment it was.
    adaptation: >-
      Osborn's rules and the hot-and-cold-water warning are quoted as written. The rule-keeper role,
      the fifteen-minute timing, the combine checkpoint, and the hand-off to a separate selection
      exercise are professor adaptations. Osborn's claims for group sessions have been contested
      since; treat this as a rule-following exercise, not proof that groups always beat individuals.
    quote:
      chicago: (Osborn 2013, chap. 26)
      verbatim: >-
        Idea-producing conferences are relatively fruitless unless certain rules are understood by
        all present, and are faithfully followed. Here are four basics: (1) Judicial judgment is
        ruled out. Criticism of ideas must be withheld until later. (2) "Free-wheeling" is welcomed.
        The wilder the idea, the better; it is easier to tame down than to think up. (3) Quantity is
        wanted. The greater the number of ideas, the more the likelihood of winners. (4) Combination
        and improvement are sought. In addition to contributing ideas of their own, participants
        should suggest how ideas of others can be turned into better ideas; or how two or more ideas
        can be joined into still another idea. […] "If you try to get hot and cold water out of the
        same faucet at the same time, you will get only tepid water. And if you try to criticize and
        create at the same time, you can't turn on either cold enough criticism or hot enough ideas.
        So let's stick solely to ideas—let's cut out all criticism during this session."
      ref_key: osborn-2013
    portfolio_trace: >-
      Problem statement; numbered idea list (photo); idea count; number of "later" calls and one
      example.
    judged_by: Portfolio rubric — process transparency
    graphic:
      svg: /assets/images/exercise-graphics/brainstorm-ground-rules-9d18fcdcbeb24a0a.svg
      png: /assets/images/exercise-graphics/brainstorm-ground-rules-9d18fcdcbeb24a0a.png
      alt: >-
        A specific problem at the centre; four rules surround it; ideas pile up first and pass
        through a judgement gate only after the session.
      caption: Create first, judge later. The gate stays closed until the idea count is in.
    used_in:
      - /lessons/en/creativity-techniques/u-2-idea-generation-selection/
  - id: consider-the-negative
    title: Consider the Negative
    technique_id: reversal-method
    status: pilot
    categories:
      - urn:in-practice:concept:constraints
      - family:generation
    fieldlex:
      - ct:solutionSpace
      - ct:lateralThinking
    units:
      - U5
      - U6
    summary: >-
      List the unwritten rules of a familiar style or product type, then negate one deep rule — do
      its opposite — and sketch what becomes possible. Changing a structural rule, not a surface
      detail, can open a whole new space of designs.
    time_min: 30
    group: pairs
    materials:
      - >-
        one familiar style or product type (for example a bus stop, a wedding invitation, a login
        screen)
      - paper or whiteboard
      - timer
    requirements:
      - Choose something both partners know well enough to list its rules.
      - Negate a structural rule (how it works or is organised), not a surface detail like colour.
      - Keep the rule list; it is part of the trace.
    accessibility: >-
      Rules can be listed in writing or spoken while a partner writes. Sketches, collages, or short
      written scenarios are all valid outputs. No movement required.
    steps:
      - >-
        Together, list six rules that every example of the style follows, even if nobody says them
        out loud.
      - >-
        Mark each rule as surface (looks) or structure (how it works). Circle the most structural
        rule.
      - >-
        Negate it — write its opposite as a new rule (for example "a bus stop is where you wait"
        becomes "a bus stop is where you never wait").
      - >-
        In ten minutes, sketch two or three designs that obey the negated rule and keep the other
        five.
      - >-
        For comparison, try dropping the rule entirely instead of negating it. Note how the results
        differ.
      - Write one sentence: what did the negation make possible that the old rule blocked?
    adaptation: >-
      Boden describes "consider the negative" and "dropping a constraint" as general heuristics for
      transforming a conceptual space; she gives no classroom procedure. The six-rule list, the
      surface/structure sort, the timings, and the negate-versus-drop comparison are professor
      adaptations of the reversal method.
    quote:
      chicago: (Boden 2004, 66)
      verbatim: >-
        One very general heuristic is consider the negative. In other words, one way of getting a
        new slant on a problem is to negate some aspect of it, whether consciously or unconsciously.
        When this heuristic is applied to a structural aspect of the problem, as opposed to a mere
        superficial detail, it can change the conceptual geography in one step. (Negating a
        constraint is not the same as dropping it: wanting any nonred sweet is not the same as
        wanting any sweet, whatever its colour. However, dropping constraints is a general
        heuristic, too. We have already seen that Kekulé's visualization of his problem could have
        been transformed by dropping the 'strings-only' constraint. Likewise, dropping Euclid's
        sixth axiom - that parallel lines meet at infinity - led to a fundamentally different,
        non-Euclidean, geometry.)
      ref_key: boden-2004
    portfolio_trace: >-
      Six-rule list with the circled rule; the negated rule; two or three sketches; the drop
      comparison; one sentence.
    judged_by: Portfolio rubric — critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/consider-the-negative-d1377f35bbaa98fe.svg
      png: /assets/images/exercise-graphics/consider-the-negative-d1377f35bbaa98fe.png
      alt: >-
        A list of style rules with one structural rule circled; negating it redraws the map of
        possible designs, while dropping it leaves an open field.
      caption: >-
        Negate a deep rule and the map changes in one step. Dropping the rule is a different move
        with different results.
    used_in:
      - /lessons/en/master-lectures/conceptual-spaces-creative-change/
      - /lessons/en/creativity-techniques/u-5-creativity-technology/
      - /lessons/en/creativity-techniques/u-6-personal-development/
  - id: down-draft-up-draft
    title: Down Draft, Up Draft
    technique_id: delay-judgement-checkpoint
    status: pilot
    categories:
      - urn:in-practice:concept:divergent-thinking
      - family:development
    fieldlex:
      - ct:divergentConvergentRhythm
      - ct:ideaDevelopment
    units:
      - U3
      - U5
    summary: >-
      Make the same piece three times with three different jobs: get it down, fix it up, then check
      every detail. Separating the passes stops you from judging work before it exists.
    time_min: 40
    group: individual, with one peer check
    materials:
      - the brief or piece you are working on
      - paper, sketchbook, or any making tool
      - timer
      - coloured pen for the third pass
    requirements:
      - The first pass is not shown to anyone and is not assessed.
      - Works for writing, sketches, layouts, storyboards, or code.
      - Keep all three versions; do not overwrite the first one.
    accessibility: >-
      Any medium is valid. Students who find the timer stressful may use page or frame counts
      instead. The peer check can be written instead of spoken.
    steps:
      - >-
        Down draft (15 minutes). Get everything out, fast and loose. Do not delete, erase, or fix
        anything. No one will see this.
      - Mark the one part of the down draft that surprised you most.
      - >-
        Up draft (15 minutes). On a fresh page, rebuild the piece around that part. Now you may cut,
        reorder, and say it more accurately.
      - >-
        Dental draft (10 minutes). With a coloured pen, check every element of the up draft against
        the brief. Mark each one keep, fix, or cut.
      - Show only the up draft and dental marks to a peer. Ask which mark they would challenge.
    adaptation: >-
      Lamott writes about prose drafts and quotes a friend's three-step naming: down draft, up
      draft, dental draft. This classroom version applies the three passes to any design medium,
      adds timings, the "mark what surprised you" bridge between passes, and the peer check.
      Lamott's own, blunter name for the first pass appears in the same chapter.
    quote:
      chicago: (Lamott 2007, 12)
      verbatim: >-
        The first draft is the child's draft, where you let it all pour out and then let it romp all
        over the place, knowing that no one is going to see it and that you can shape it later. […]
        Almost all good writing begins with terrible first efforts. You need to start somewhere.
        Start by getting something—anything—down on paper. A friend of mine says that the first
        draft is the down draft—you just get it down. The second draft is the up draft—you fix it
        up. You try to say what you have to say more accurately. And the third draft is the dental
        draft, where you check every tooth, to see if it's loose or cramped or decayed, or even, God
        help us, healthy.
      ref_key: lamott-2007
    portfolio_trace: >-
      Down draft (photo), the surprise mark, up draft, dental marks, and the peer's challenge in one
      line.
    judged_by: Portfolio rubric — process transparency; critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/down-draft-up-draft-7a7b949f8fdfdc64.svg
      png: /assets/images/exercise-graphics/down-draft-up-draft-7a7b949f8fdfdc64.png
      alt: >-
        Three versions of the same piece; a loose down draft, a rebuilt up draft, and a dental draft
        marked keep, fix, or cut.
      caption: Each pass has one job. Judging waits until there is something to judge.
    used_in:
      - /lessons/en/creativity-techniques/u-3-development-solutions/
  - id: follow-dogme-95-rules
    title: Follow Dogme 95 Rules
    technique_id: constraint-writing
    status: ready
    categories:
      - urn:in-practice:concept:constraints
      - family:generation
    fieldlex:
      - ct:generativeAiCoCreation
      - ct:processTransparency
    units:
      - U5
      - U6
    summary: >
      Set one temporary formal rule for a short piece, make under that rule, then compare a freer
      pass. Built for Year-3 designers who already have craft — including treating “no generative
      fill” as one possible rule among others.
    time_min: 25
    group: 1–2
    materials:
      - one shared brief or current D1 problem
      - paper, layout tool, or other medium you already use
      - optional generative tool only if your chosen rule allows it
    requirements:
      - You already have a short piece to make (text, layout, sound, image sequence).
      - Agree the rule before you open any generative tool.
      - Do not photograph people; this exercise is about formal rules, not fieldwork.
    accessibility: >
      Rules can be oral, typed, or icon-based. A seated version uses the same rule on a small
      digital canvas. Voice notes count as the freer comparison pass.
    steps:
      - Choose a short piece tied to your brief (about fifteen minutes of making).
      - >-
        Write one strict temporary rule. Examples adapted for design studio — only five shapes; one
        colour; diegetic type only (words that could exist in the scene); no generative fill; one
        language only.
      - Make the piece under the rule within the time limit.
      - Make a second version without the rule (or with the rule relaxed).
      - >-
        Compare which version is more surprising, and which better fits the brief. Name one craft
        move the rule forced.
    adaptation: >
      Classroom timing (25 minutes), design-studio rule examples, and optional GenAI as a rule among
      others are professor adaptations of Rubin’s Temporary Rules / Dogme 95 discussion. Steps
      follow the course canonical technique constraint-writing.
    quote:
      chicago: (Rubin 2023, 65)
      verbatim: >-
        The imposition of rules is most valuable for an artist who has already made some work. If
        you’re established in a craft or field, temporary rules may be useful to break a pattern.
        They can challenge you to become better, to innovate, and to bring out a new side of
        yourself or your work. […] The director Lars von Trier came up with ten rules, Dogme 95 The
        Vow of Chastity, designed to reduce the artificiality of filmmaking. They were as follows:
        Shooting must be performed on location, without providing props or sets that don’t logically
        exist within that setting. Diegetic sound only. Sounds must never be produced, such as music
        that does not exist within the scene. All shots must be handheld. Movement, immobility, and
        stability must be attained by hand. […] The rules of baseball or basketball define the game
        and are rarely altered. Innovation exists only within those rules. As artists, we get to
        create a new set of rules each and every time we play. After careful consideration, we may
        choose to break them in the midst of a project if a discovery impels us. While it’s easy to
        make these changes, there’s little use to rules if they are not taken seriously.
      ref_key: rubin-2023
    portfolio_trace: >
      The rule in one line; both versions (or photos of them); one sentence on what the rule forced;
      AI declaration if a generative tool was used.
    judged_by: Portfolio rubric — creative fluency, flexibility, and originality
    graphic:
      svg: /assets/images/exercise-graphics/follow-dogme-95-rules-63364ca1768e9c4f.svg
      png: /assets/images/exercise-graphics/follow-dogme-95-rules-63364ca1768e9c4f.png
      alt: >-
        A temporary rule shapes one version beside a freer version; the two are compared for
        surprise, fit, and craft.
      caption: The rule is a temporary making condition. Compare what it forces with what the brief needs.
    used_in:
      - /lessons/en/creativity-techniques/u-5-creativity-technology/
  - id: hits-and-dot-voting
    title: Hits and dot voting
    technique_id: hits-dot-voting
    status: ready
    categories:
      - urn:in-practice:concept:selection
      - family:selection
    fieldlex: []
    units:
      - U2
      - U4
    summary: >-
      Mark interesting parts in silence before you debate. Hits gather heat; a later vote decides —
      without groupthink in the first pass.
    time_min: 15
    group: 3–10
    materials:
      - idea sheets on a wall or board
      - dot stickers
      - optional digital whiteboard
    requirements:
      - Ideas must already be visible (one per sheet).
      - No talking during the heat-map pass.
    accessibility: Digital whiteboard voting; allow seated access to the wall.
    steps:
      - Put all ideas on the wall, one per note or sheet.
      - Read in silence; each person places small dots on parts that look strong (hits).
      - Each person then gets one larger vote for one idea.
      - Cluster the dots and read out the top three.
      - The decider (or the group) chooses, and records why.
    adaptation: >-
      Classroom timing and portfolio fields are professor adaptations of the sprint sticky decision
      / heat map sequence.
    quote:
      chicago: (Knapp, Zeratsky, and Kowitz 2016, chap. 10)
      verbatim: >-
        We’ve spent years optimizing our sprint decisions to be as efficient as possible. We ended
        up with a five-step process—and coincidentally, every step involves something sticky: 1. Art
        museum: Put the solution sketches on the wall with masking tape. 2. Heat map: Look at all
        the solutions in silence, and use dot stickers to mark interesting parts. 3. Speed critique:
        Quickly discuss the highlights of each solution, and use sticky notes to capture big ideas.
        4. Straw poll: Each person chooses one solution, and votes for it with a dot sticker. 5.
        Supervote: The Decider makes the final decision, with—you guessed it—more stickers. This
        sticky stuff isn’t a gimmick. The dot stickers let us form and express our opinions without
        lengthy debate, and the sticky notes allow us to record big ideas without relying on our
        short-term memory.
      ref_key: knapp-2016
    portfolio_trace: Photo or list of dotted sheets; top three; chosen idea and criterion.
    judged_by: Portfolio rubric — critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/hits-and-dot-voting-1cbc89f2719a678e.svg
      png: /assets/images/exercise-graphics/hits-and-dot-voting-1cbc89f2719a678e.png
      alt: >-
        Silent small marks identify promising parts across the idea board; a separate larger vote
        selects one idea.
      caption: >-
        Notice interesting parts before debate, then make the final selection visible as a separate
        decision.
    used_in:
      - /lessons/en/creativity-techniques/u-2-idea-generation-selection/
  - id: idea-spurring-questions
    title: Idea-Spurring Questions
    technique_id: scamper
    status: pilot
    categories:
      - urn:in-practice:concept:divergent-thinking
      - family:generation
    fieldlex:
      - ct:ideaProduction
      - ct:creativeProblemSolving
    units:
      - U2
      - U4
    summary: >-
      Take one existing object, layout, or service and run it through Osborn's nine questions: other
      uses, adapt, modify, magnify, minify, substitute, rearrange, reverse, combine. One quick
      sketch per question gives nine variants to choose from. (This checklist is the source of the
      later SCAMPER acronym.)
    time_min: 35
    group: individual or pairs
    materials:
      - one existing thing to change (product, poster, screen, room, service step)
      - a sheet folded into nine boxes, or a nine-frame digital board
      - the nine questions printed on a card
      - timer
    requirements:
      - >-
        Start from something that already exists; the questions work on a concrete starting point,
        not a blank page.
      - One sketch or note per box; quantity before quality.
      - Any working language is fine; sketches count as answers.
    accessibility: >-
      Answers can be drawn, written, typed, or spoken to a partner who sketches. The card can be
      read aloud. Pairs may split the nine questions between them.
    steps:
      - >-
        Draw or paste the starting thing in the centre of the page. Write one line on what it is
        for.
      - Set a timer for three minutes per question. Work through the nine questions in order.
      - >-
        In each box, make one quick sketch or note that answers that question. If stuck, read the
        sub-questions on the card.
      - >-
        When all nine boxes are full, star the two variants that most change how the thing works,
        not just how it looks.
      - Develop one starred variant into a slightly larger sketch with a one-line reason.
    adaptation: >-
      Osborn lists these questions as a self-questioning summary for finding alternatives. The
      nine-box sheet, three-minute timing, and the "changes how it works" selection step are
      professor adaptations. Later authors condensed the list into the SCAMPER acronym; this
      datasheet uses Osborn's own wording.
    quote:
      chicago: (Osborn 2013, chap. 24)
      verbatim: >-
        Put to other uses? New ways to use as is? Other uses if modified? Adapt? What else is like
        this? What other idea does this suggest? Does past offer parallel? What could I copy? Whom
        could I emulate? Modify? New twist? Change meaning, color, motion, sound, odor, form, shape?
        Other changes? Magnify? What to add? More time? Greater frequency? Stronger? Higher? Longer?
        Thicker? Extra value? Plus ingredient? Duplicate? Multiply? Exaggerate? Minify? What to
        subtract? Smaller? Condensed? Miniature? Lower? Shorter? Lighter? Omit? Streamline? Split
        up? Understate? Substitute? Who else instead? What else instead? Other ingredient? Other
        material? Other process? Other power? Other place? Other approach? Other tone of voice?
        Rearrange? Interchange components? Other pattern? Other layout? Other sequence? Transpose
        cause and effect? Change pace? Change schedule? Reverse? Transpose positive and negative?
        How about opposites? Turn it backward? Turn it upside down? Reverse roles? Change shoes?
        Turn tables? Turn other cheek? Combine? How about a blend, an alloy, an assortment, an
        ensemble? Combine units? Combine purposes? Combine appeals? Combine ideas?
      ref_key: osborn-2013
    portfolio_trace: The nine-box sheet (photo); two starred variants; one developed sketch with its reason.
    judged_by: Portfolio rubric — process transparency
    graphic:
      svg: /assets/images/exercise-graphics/idea-spurring-questions-ea74252f4b4e583f.svg
      png: /assets/images/exercise-graphics/idea-spurring-questions-ea74252f4b4e583f.png
      alt: >-
        One existing object sits at the centre of nine question spokes; each spoke produces a
        variant, and two variants are starred.
      caption: >-
        Nine questions, nine variants. Star the ones that change how the thing works, not only how
        it looks.
    used_in:
      - /lessons/en/creativity-techniques/u-2-idea-generation-selection/
      - /lessons/en/creativity-techniques/u-4-1-generate-before-you-judge/
  - id: imposing-constraints
    title: Imposing Constraints
    technique_id: constraint-writing
    status: ready
    categories:
      - urn:in-practice:concept:constraints
      - family:generation
    fieldlex:
      - ct:processTransparency
    units:
      - U5
      - U6
    summary: >
      Add a deliberate constraint to a freewheeling idea pass so craft pressure produces form. Same
      technique family as Follow Dogme 95 Rules, with a philosophical warrant that constraints can
      enhance creativity.
    time_min: 25
    group: 1–2
    materials:
      - brief or problem statement
      - making materials for one short piece
      - timer
    requirements:
      - Start from a draft or idea set that already feels too open or random.
      - The constraint must be formal (metre, palette, structure, tool ban) — not “work harder.”
      - International cohorts may choose a constraint in any working language.
    accessibility: >
      Constraints may be written as a checklist or spoken aloud. Digital whiteboard versions are
      valid. No walking required.
    steps:
      - Show or name the unconstrained draft (two minutes).
      - >-
        Add one constraint that narrows form (for example fixed grid, twelve-bar structure analogue,
        two colours, fifty words, no generative fill).
      - Remake or revise under that constraint for about fifteen minutes.
      - Note which options the constraint removed, and which new moves it forced.
      - Keep or reject the constrained version with one criterion tied to the brief.
    adaptation: >
      Steps are a classroom adaptation of the catalogue record Imposing Constraints and the course
      technique constraint-writing. Timing and design-studio examples are professor adaptations; the
      quoted warrant is from Kieran.
    quote:
      chicago: (Kieran 2018, 28)
      verbatim: >-
        So far, this heuristic may seem too freewheeling, too random, too haphazard, and not serious
        enough for your liking—though seriousness and value seem quite orthogonal to me. (And
        creativity itself is often the result of random or haphazard events or processes—witness
        Kekulé’s discovery of the benzene ring after having a dream of a snake eating its own tail.)
        Very well, then; add constraints. It is well known in the psychological literature that
        constraints can enhance creativity—‘necessity is the mother of invention’, and all that.
        (See Stokes (2006).) Blues musicians improvising within a 12-bar structure know this.
        Songwriters and poets know this; think of constraints on metre or rhyme, as we find in
        sonnets, for example. The Oulipo group of (mostly French) writers and mathematicians impose
        constraints on their works to foster creativity.
      ref_key: kieran-2018
    portfolio_trace: |
      Unconstrained note; the constraint in one line; constrained piece; keep/reject criterion.
    judged_by: Portfolio rubric — critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/imposing-constraints-385dfe9ca1f88c17.svg
      png: /assets/images/exercise-graphics/imposing-constraints-385dfe9ca1f88c17.png
      alt: >-
        A wide draft is reshaped inside a deliberate constraint; some paths close while new formal
        moves become possible.
      caption: >-
        A constraint narrows the field and can make new moves possible; keep or reject the result
        against the brief.
    used_in:
      - /lessons/en/master-lectures/conceptual-spaces-creative-change/
      - /lessons/en/creativity-techniques/u-5-creativity-technology/
  - id: mental-locks-audit
    title: Mental locks audit
    technique_id: mental-locks-audit
    status: ready
    categories:
      - urn:in-practice:concept:reflection
      - family:reflection
    fieldlex: []
    units:
      - U6
    summary: >-
      Name the belief that closed an idea. Reopen one locked path for five minutes — personal
      development as craft, not soft-skill theatre.
    time_min: 15
    group: individual
    materials:
      - a dropped or blocked idea from recent work
      - paper
    requirements:
      - Stay tied to a making brief.
      - Do not treat this as therapy.
    accessibility: Typed or oral audit OK.
    steps:
      - Pick one idea you dropped this week.
      - Write the belief or rule that closed it (the “lock”).
      - Reopen the idea for five minutes under a temporary opposite rule.
      - Note what appeared that the lock had blocked.
      - Decide keep, transform, or shelve — with one craft reason.
    adaptation: >-
      Classroom adaptation of Open Mental Locks catalogue records (von Oech held; steps are course
      wording).
    quote:
      chicago: (course adaptation)
      verbatim: >-
        Mental locks are the beliefs that close an idea before it has been tested—“that is not
        logical,” “we already tried that,” “people like us don’t do this.” The classroom audit asks
        you to name one lock that ended a recent idea, ask when that belief helps and when it
        blocks, then reopen the dropped idea for five private minutes with the lock set aside. What
        changes in those five minutes is the evidence; the lock itself is not graded as a
        confession. (Classroom adaptation of Open Mental Locks catalogue records; von Oech is held,
        not cited as a student quotation here.)
      ref_key: ''
    portfolio_trace: Dropped idea; lock sentence; five-minute reopen note; keep/transform/shelve.
    judged_by: Portfolio rubric — critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/mental-locks-audit-7f25bf1e259d439e.svg
      png: /assets/images/exercise-graphics/mental-locks-audit-7f25bf1e259d439e.png
      alt: >-
        A belief blocks a dropped idea; a temporary opposite rule opens a short test before the
        student decides what to do.
      caption: The belief is tested through making—not graded as a personal confession.
    used_in:
      - /lessons/en/creativity-techniques/u-6-personal-development/
  - id: morning-pages
    title: Morning Pages
    technique_id: creative-journal
    status: pilot
    categories:
      - urn:in-practice:concept:creative-habits
      - urn:in-practice:concept:reflection
      - family:reflection
    fieldlex:
      - ct:overcomingBlocks
      - ct:sustainedCreativePractice
    units:
      - U1
      - U6
    summary: >-
      Write three pages of fast, unedited longhand before you start a design task. The pages are
      private and never assessed; their job is to empty out the inner critic so the next idea pass
      starts with a clearer head.
    time_min: 20
    group: individual
    materials:
      - three sheets of lined or plain paper (or a notebook)
      - pen or pencil
      - timer
      - an envelope or folder to keep the pages private
    requirements:
      - >-
        Nobody reads the pages — not the professor, not a partner. Only the date and page count are
        shared.
      - Write by hand if you can; speed matters more than neatness.
      - Run it before a generation exercise in the same session, so the effect can be noticed.
    accessibility: >-
      Students who cannot write longhand may type with the screen dimmed, dictate into a private
      voice memo, or write fewer, larger pages; the rule is continuous output without rereading. Any
      language is fine. Students may opt out of the in-class pass and do it at home instead.
    steps:
      - Set a timer for fifteen minutes and write the date at the top of page one.
      - >-
        Write without stopping until you fill three pages. If nothing comes, write "nothing comes"
        until something does.
      - >-
        When the critic starts commenting ("this is boring", "you can't spell"), write the comment
        down and keep going.
      - Do not reread. Fold the pages and put them away.
      - >-
        Start the next exercise straight away. Afterwards, note in one line whether the first ideas
        came faster or slower than usual.
    adaptation: >-
      Cameron's tool is a daily, at-home practice done first thing in the morning; this classroom
      version is one fifteen-minute pass at the start of a studio session, done as a warm-up before
      idea generation. Repeating it at home for a week is optional homework. Timing, the opt-out,
      and the one-line note are professor adaptations. The three-pages, longhand, do-not-reread
      rules follow Cameron's workbook instructions; the quoted warrant is from The Artist's Way.
    quote:
      chicago: (Cameron 2002, “The Basic Tools”)
      verbatim: >-
        The morning pages are the primary tool of creative recovery. As blocked artists, we tend to
        criticize ourselves mercilessly. Even if we look like functioning artists to the world, we
        feel we never do enough and what we do isn't right. We are victims of our own internalized
        perfectionist, a nasty internal and eternal critic, the Censor, who resides in our (left)
        brain and keeps up a constant stream of subversive remarks that are often disguised as the
        truth. […] Make this a rule: always remember that your Censor's negative opinions are not
        the truth. This takes practice. By spilling out of bed and straight onto the page every
        morning, you learn to evade the Censor. Because there is no wrong way to write the morning
        pages, the Censor's opinion doesn't count. Let your Censor rattle on. (And it will.) Just
        keep your hand moving across the page.
      ref_key: cameron-2002
    portfolio_trace: Date and page count only (the pages stay private); one line on how the next idea pass felt.
    judged_by: Portfolio rubric — process transparency (habit evidence, not content)
    graphic:
      svg: /assets/images/exercise-graphics/morning-pages-37a07fa00974106e.svg
      png: /assets/images/exercise-graphics/morning-pages-37a07fa00974106e.png
      alt: >-
        Three pages of continuous handwriting drain the critic's comments into the margin, leaving a
        clear start for the next idea pass.
      caption: >-
        Keep the hand moving for three pages; the critic's comments go onto the page instead of into
        the next design move.
    used_in:
      - /lessons/en/creativity-techniques/u-1-introduction-creativity/
      - /lessons/en/creativity-techniques/u-6-personal-development/
  - id: one-inch-picture-frame
    title: One-inch picture frame
    technique_id: entry-point-attention-area
    status: ready
    categories:
      - urn:in-practice:concept:problem-framing
      - family:framing
    fieldlex:
      - ct:visualProblemFraming
    units:
      - U3
    summary: >-
      Narrow a broad design brief to one small, observable moment. Make a quick sketch or
      description of only what fits inside that frame, then use the missing details to decide what
      to explore next.
    time_min: 20
    group: individual, then pair review
    materials:
      - current design brief or project idea
      - paper and pen, or a small digital canvas
      - optional paper frame or crop tool
    requirements:
      - Choose one user, object, or moment from the brief.
      - Keep this pass exploratory; do not grade the first sketch or description.
    accessibility: >-
      Students may draw, write, type, dictate, or use a cropped digital image. No physical frame is
      required.
    steps:
      - Write the broad brief at the top of the page.
      - Choose one small moment, view, or interaction that can be described in a single frame.
      - >-
        Spend five minutes sketching or describing only what is visible in that frame; mark unknowns
        as questions.
      - Show the frame to a partner. Ask what they notice first and what remains unclear.
      - Use one observation and one unanswered question to set the next design move.
    adaptation: >-
      Lamott describes narrowing a writing task to one small picture frame and one paragraph. This
      classroom adaptation transfers that scale of attention to a design brief; the five-minute
      timing and peer prompt are instructor choices.
    quote:
      chicago: (Lamott 2007, 11)
      verbatim: >-
        It reminds me that all I have to do is to write down as much as I can see through a one-inch
        picture frame. […] All I am going to do right now, for example, is write that one paragraph
        that sets the story in my hometown, in the late fifties, when the trains were still running.
        I am going to paint a picture of it, in words, on my word processor. Or all I am going to do
        is to describe the main character the very first time we meet her, when she first walks out
        the front door and onto the porch. […] just what I can see through the one-inch picture
        frame, just one paragraph describing this woman, in the town where I grew up, the first time
        we encounter her.
      ref_key: lamott-2007
    portfolio_trace: >-
      One-frame sketch or description; the observation from the partner; the unanswered question;
      the next move it suggests.
    judged_by: Portfolio rubric — problem framing, purposeful observation, and reasoned development
    graphic:
      svg: /assets/images/exercise-graphics/one-inch-picture-frame-4e4510facab0d72f.svg
      png: /assets/images/exercise-graphics/one-inch-picture-frame-4e4510facab0d72f.png
      alt: >-
        A broad brief narrows to one small visible moment; a partner's observation and an unanswered
        question guide the next move.
      caption: >-
        Frame one observable moment. What is outside it becomes a useful question for the next
        design move.
    used_in:
      - /lessons/en/creativity-techniques/u-3-development-solutions/
  - id: parallel-prototyping
    title: Parallel Prototyping
    technique_id: parallel-prototyping
    status: pilot
    categories:
      - urn:in-practice:concept:prototyping
      - family:development
    fieldlex:
      - ct:prototyping
      - ct:divergentConvergentRhythm
    units:
      - U3
      - U5
    summary: >-
      Make three quick prototypes side by side before anyone gives feedback, then two more, then a
      final. In the source study, designers who worked this way produced better and more varied
      results, and felt more confident, than designers who refined one prototype at a time.
    time_min: 70
    group: individual makers, with a peer giving feedback
    materials:
      - one short brief (poster, banner, screen, label, or similar)
      - paper or a simple design tool
      - timer
      - feedback cards (one line of description per prototype, no ranking)
    requirements:
      - Prototypes must be rough — about ten minutes each.
      - Feedback describes what a prototype does; it does not say which one is best.
      - Keep every prototype, numbered in the order made.
    accessibility: >-
      Any medium is valid (paper, slides, Figma, cardboard). Feedback may be written on cards
      instead of spoken. The session can be split across two classes: three prototypes and feedback
      in one, the rest in the next.
    steps:
      - >-
        Read the brief. Set a timer and make three different prototypes, about ten minutes each. Do
        not stop to polish.
      - >-
        Swap with a peer. They write one descriptive feedback line on each of the three (about five
        minutes).
      - Make two more prototypes (ten minutes each), using what you learned from all three.
      - Get one feedback line on each of the two new ones.
      - Make a final version (fifteen minutes). It may combine parts of any earlier prototype.
      - >-
        Lay all six side by side. Write which earlier prototype the final borrows from, and what you
        would have missed with only one.
    adaptation: >-
      Dow and colleagues ran this structure as a controlled experiment with web banner ads and an
      expert's scripted critique. This classroom version keeps their timings and the 3 → feedback →
      2 → feedback → final structure; peer feedback cards replace the expert critique, and the
      side-by-side reflection is a professor addition.
    quote:
      chicago: (Dow et al. 2010, 18:5)
      verbatim: >-
        The experiment employed a between-subjects design with one independent variable: the
        structure of the prototyping process. The study held constant the number of prototypes
        created, the amount of feedback provided, and the overall time allotted. In the parallel
        condition, participants created 3 prototypes and got feedback, then made 2 more and got more
        feedback, and then made a final version. In the serial condition, participants created 5
        prototypes in a series, received feedback after each prototype, then made a final version.
        Parallel participants were instructed to start subsequent prototypes at the same intervals
        as serial participants.
      ref_key: dow-2010
    portfolio_trace: >-
      Six numbered prototypes (photos); the five feedback lines; one paragraph tracing what the
      final borrows.
    judged_by: Portfolio rubric — process transparency; critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/parallel-prototyping-5d4388ad4707e1c1.svg
      png: /assets/images/exercise-graphics/parallel-prototyping-5d4388ad4707e1c1.png
      alt: >-
        Three prototypes are made side by side, receive feedback together, then two more are made,
        then one final that draws on all of them.
      caption: >-
        Make several before you hear feedback. Comparing options side by side keeps you from
        polishing the first idea too early.
    used_in:
      - /lessons/en/creativity-techniques/u-3-development-solutions/
      - /lessons/en/creativity-techniques/u-5-creativity-technology/
  - id: process-trail
    title: Process trail
    technique_id: process-trail
    status: ready
    categories:
      - urn:in-practice:concept:reflection
      - family:reflection
    fieldlex:
      - ct:processTransparency
    units:
      - U1
      - U5
    summary: >-
      Order every version and discarded idea on one board. Mark diverge and converge; write the
      turning point assessors can read.
    time_min: 20
    group: individual; optional pair read
    materials:
      - exports from a recent making loop
      - one board slide or A3 sheet
    requirements:
      - Include discarded options.
      - Attach tool prompts where they belong.
    accessibility: Digital board accepted; voice caption for the turning point OK.
    steps:
      - Save every version, sketch, and discarded idea with a date or order number.
      - Arrange them in order on one page or board.
      - Mark where you diverged (opened options) and converged (closed them).
      - Write one paragraph on the turning point — what changed your direction?
      - Attach tool prompts to the steps where they belong.
    adaptation: >-
      Professor adaptation of process-journal catalogue practice; diverge/converge marks and GenAI
      prompt attachments are course wording (source status: gap).
    quote:
      chicago: (course adaptation)
      verbatim: >-
        A process trail makes the path of work legible: every sketch, discarded option, and revision
        is kept in order so that diverge and converge moves can be marked, and so that a later
        reader can find the turning point where judgment changed the direction of the work. In this
        course the trail is the assessable object—not a single polished final—because creativity
        techniques are judged by how options were opened and closed under a brief. (Catalogue
        witness only; no single authoritative book quote is claimed for this classroom procedure.)
      ref_key: ''
    portfolio_trace: Ordered trail; diverge/converge marks; turning-point paragraph; prompt attachments.
    judged_by: Portfolio rubric — critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/process-trail-38e2c4629d80d1b1.svg
      png: /assets/images/exercise-graphics/process-trail-38e2c4629d80d1b1.png
      alt: >-
        Ordered versions show ideas opening and closing; one marked turning point explains why the
        design direction changed.
      caption: >-
        The trail makes the process legible: keep discarded options and mark the moment judgment
        changed direction.
    used_in:
      - /lessons/en/master-lectures/who-creates-edison/
      - /lessons/en/creativity-techniques/u-5-creativity-technology/
  - id: pure-contour-drawing
    title: Pure Contour Drawing
    technique_id: pure-contour-drawing
    status: pilot
    categories:
      - urn:in-practice:concept:observation
      - family:embodied
    fieldlex:
      - ct:sketchingAsThinking
      - ct:mentalBlock
    units:
      - U1
      - U4
    summary: >-
      Draw the creases of your own palm for five minutes without looking at the paper. The drawing
      will not look like a hand; that is the point. It trains slow, exact looking and switches off
      the habit of drawing what you think things look like.
    time_min: 15
    group: individual, then pairs to compare
    materials:
      - one sheet of paper, taped to the table
      - pencil or fine pen
      - timer
    requirements:
      - No drawing skill needed; results are not judged on likeness.
      - Tape the paper down before you start so it does not move.
      - Keep this pass separate from project work; it is a perception warm-up.
    accessibility: >-
      Any complex object can replace the palm (crumpled paper, a leaf, a key) if holding the hand
      still is uncomfortable. Students may sit any way that lets them face away from the paper. A
      tablet with the screen covered works too. Low-vision students can trace a textured object by
      touch.
    steps:
      - >-
        Tape the paper down. Hold the pencil on it, then turn your body so you face away from the
        paper.
      - >-
        Set a timer for five minutes. Rest your other hand somewhere stable and look at the creases
        in your palm.
      - >-
        Pick one crease. Move your eyes along it very slowly and let the pencil move at exactly the
        same speed.
      - >-
        When the crease meets another line, follow the new line. Do not look at the paper until the
        timer ends.
      - >-
        Look at the drawing. With a partner, name one detail you saw that you would normally never
        notice.
      - Write one sentence on how your attention changed between minute one and minute five.
    adaptation: >-
      Edwards demonstrates the method and gives it to drawing students as a single five-minute
      exercise. This classroom version keeps her five-minute timer, the palm subject, and the
      no-peeking rule; the partner comparison and the one-sentence attention note are professor
      additions that turn the drawing into evidence for the portfolio.
    quote:
      chicago: (Edwards 1999, 90)
      verbatim: >-
        Gaze at a single wrinkle in your palm. Place your pencil on the paper and begin to draw just
        that edge. As your eyes track the direction of the edge very slowly, one millimeter at a
        time, your pencil will record your perceptions. If the edge changes direction, so does your
        pencil. If the edge intersects with another edge, follow that new information slowly with
        your eyes, while your pencil simultaneously records every detail. An important point: Your
        pencil can record only what you see-nothing more, nothing less-at the moment of seeing. Your
        hand and pencil function like a seismograph, responding only to your actual perceptions.
      ref_key: edwards-1999
    portfolio_trace: >-
      The contour drawing (photo or scan); one detail you noticed; one sentence on how attention
      changed.
    judged_by: Portfolio rubric — process transparency
    graphic:
      svg: /assets/images/exercise-graphics/pure-contour-drawing-382312b619b792fc.svg
      png: /assets/images/exercise-graphics/pure-contour-drawing-382312b619b792fc.png
      alt: >-
        The eye follows one crease of the palm while the pencil, out of sight, records the same line
        slowly like a seismograph trace.
      caption: >-
        Eye and pencil move at the same slow speed; the drawing records what you saw, not what a
        hand is supposed to look like.
    used_in:
      - /lessons/en/creativity-techniques/u-1-introduction-creativity/
      - /lessons/en/creativity-techniques/u-4-2-select-with-care/
  - id: question-led-rough-prototype
    title: Question-led rough prototype
    technique_id: question-led-prototype
    status: ready
    categories:
      - urn:in-practice:concept:prototyping
      - family:development
    fieldlex:
      - ct:prototyping
      - ct:generativeAiCoCreation
    units:
      - U3
      - U5
    summary: >-
      Build the smallest surface that answers one test question. Optional generative tools stay in
      early variation; you keep the final form.
    time_min: 20
    group: alone to make; one classmate tests
    materials:
      - shared class brief or D1 problem
      - paper/card or digital mock-up tool
      - optional generative tool for early variation only
    requirements:
      - Write the test question before you build.
      - If you use GenAI, log prompt, keep, and re-author moves.
    accessibility: Seated digital mock-ups accepted; oral test answers OK.
    steps:
      - Write the one question this prototype must answer.
      - Decide whether it tests role, look and feel, or how it works.
      - >-
        Build only the surface needed to answer it — by hand, code, or staged tool output you then
        edit.
      - >-
        If a generative tool supplied a variant, log the prompt, what you kept, and what you
        re-authored.
      - Let one classmate try the prototype; record the answer to your question.
    adaptation: >-
      20-minute class timing; optional GenAI for variation only; mandatory prompt/edit log are
      professor adaptations of the sprint prototype mindset.
    quote:
      chicago: (Knapp, Zeratsky, and Kowitz 2016, chap. 13)
      verbatim: >-
        Don’t prototype anything you aren’t willing to throw away. Remember: This solution might not
        work. So don’t give in to the temptation of spending a few days or weeks getting your
        prototype ready. You’ll have diminishing returns on that extra work, and all the while,
        you’ll be falling deeper in love with a solution that could turn out to be a loser. […] The
        prototype is meant to answer questions, so keep it focused. You don’t need a fully
        functional product—you just need a real-looking façade to which customers can react.
      ref_key: knapp-2016
    portfolio_trace: The brief; the test question; before/after; prompts or manual steps; the test answer.
    judged_by: Portfolio rubric — creative fluency, flexibility, and originality
    graphic:
      svg: /assets/images/exercise-graphics/question-led-rough-prototype-88685913cf9d75c1.svg
      png: /assets/images/exercise-graphics/question-led-rough-prototype-88685913cf9d75c1.png
      alt: >-
        One test question shapes a minimal prototype, which a classmate tries; the answer determines
        the next design move.
      caption: >-
        Build only enough to answer the question; let the test response—not polish—set the next
        move.
    used_in:
      - /lessons/en/creativity-techniques/u-3-development-solutions/
      - /lessons/en/creativity-techniques/u-5-creativity-technology/
  - id: random-word-stimulation
    title: Random word stimulation
    technique_id: random-word
    status: ready
    categories:
      - urn:in-practice:concept:association
      - family:generation
    fieldlex: []
    units:
      - U2
      - U5
    summary: >-
      Force a lateral jump: relate a random word to your brief, then show the path. Same word, many
      situations.
    time_min: 10
    group: individual, then brief share
    materials:
      - random word (card, book, or app)
      - brief
      - paper
    requirements:
      - Agree one shared brief.
      - Do not swap the random word mid-pass.
    accessibility: Spoken paths accepted; seated work OK.
    steps:
      - State the problem in one sentence.
      - Draw or receive one random word.
      - Write three links from the word to the problem without judging them.
      - Pick one link and sketch or note a design move it suggests.
      - >-
        Optional: one student describes their path to the class so others see the same word used
        differently.
    adaptation: >-
      Ten-minute class clock and design-studio wording are professor adaptations of de Bono’s
      random-word classroom session.
    quote:
      chicago: (de Bono 1970, 28)
      verbatim: >-
        The students each write down any problem they would like to tackle. They write it down in
        duplicate, put a name or number on each sheet, and give one copy to the teacher. This is to
        prevent a sudden change in the problem when the random word is given. A random word is then
        found (by page number etc suggested by the students to locate a word in the dictionary or
        just chosen by the teacher). […] Before they hand in their results some of the students are
        asked by the teacher to describe to the rest of the class how they related the word to their
        own problem. In this type of session one can get an idea of how the same random word can be
        of use in many different situations. If some students find that they cannot make any
        progress at all then the teacher goes through the problem with them showing how the random
        word might be used in each case.
      ref_key: debono-1970
    portfolio_trace: Problem sentence; random word; three links; chosen move.
    judged_by: Portfolio rubric — creative fluency, flexibility, and originality
    graphic:
      svg: /assets/images/exercise-graphics/random-word-stimulation-3b1524832b2df974.svg
      png: /assets/images/exercise-graphics/random-word-stimulation-3b1524832b2df974.png
      alt: >-
        One random word branches into three links to the brief; one link becomes a design move while
        the others remain visible.
      caption: Keep the associative path visible so the lateral jump can be explained and revisited.
    used_in:
      - /lessons/en/creativity-techniques/u-2-idea-generation-selection/
  - id: reflection-in-action-log
    title: Reflection-in-action log
    technique_id: reflection-in-action-log
    status: ready
    categories:
      - urn:in-practice:concept:reflection
      - family:reflection
    fieldlex:
      - ct:processTransparency
    units:
      - U3
      - U6
    summary: Log surprises while you work — when the situation talks back — then name one move you changed.
    time_min: 15
    group: individual
    materials:
      - current making session
      - notebook or voice notes
    requirements:
      - Log during work, not only after polishing.
      - Keep entries short and dated.
    accessibility: Voice notes accepted; no drawing required.
    steps:
      - During a short making pass, note three moments of surprise or resistance.
      - For each, write what the work “said back” (a constraint, a failure, an unexpected fit).
      - Name one strategy you changed in response.
      - Mark whether the change opened or closed options.
      - Keep the log beside the artefact for critique.
    adaptation: >-
      Classroom timing and portfolio fields adapt Schön’s reflective conversation to a short studio
      log.
    quote:
      chicago: (Schön 1983, 79)
      verbatim: >-
        In a good process of design, this conversation with the situation is reflective. In answer
        to the situation’s back-talk, the designer reflects-in-action on the construction of the
        problem, the strategies of action, or the model of the phenomena, which have been implicit
        in his moves. […] But the practitioner’s moves also produce unintended changes which give
        the situations new meanings. The situation talks back, the practitioner listens; and as he
        appreciates what he hears, he reframes the situation once again. When Quist discovers that
        his moves have produced a gallery which is “in a minor way . . . the major thing,” he
        becomes aware of a new whole idea, which sets criteria for the further designing.
      ref_key: schon-1983
    portfolio_trace: Three surprise notes; one changed strategy; open/close mark.
    judged_by: Portfolio rubric — critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/reflection-in-action-log-a8939c48353ca113.svg
      png: /assets/images/exercise-graphics/reflection-in-action-log-a8939c48353ca113.png
      alt: >-
        Making produces a surprise; the student records the situation's response, changes strategy,
        and returns to making.
      caption: >-
        Reflection happens during the work: notice its response, change a move, and see what the new
        move makes possible.
    used_in:
      - /lessons/en/creativity-techniques/u-6-personal-development/
  - id: seed-collection
    title: Seed collection
    technique_id: seed-collection
    status: ready
    categories:
      - urn:in-practice:concept:creative-habits
      - family:generation
    fieldlex: []
    units:
      - U2
      - U4
      - U6
    summary: >-
      Collect many small starting points without ranking them. Later, water the ones that still
      resonate — photos, phrases, and sounds all count.
    time_min: 20
    group: individual or pairs
    materials:
      - notebook or phone notes
      - optional camera for tools/fixtures only (no people)
    requirements:
      - Do not rank while collecting.
      - 'If photographing on campus: tools and fixtures only; no faces or badges.'
    accessibility: Voice notes, photos or text all count as seeds.
    steps:
      - Collect at least five seeds (phrase, sound, image, tool, fixture) in one place.
      - Do not compare or rank them while collecting.
      - Pick three seeds that still interest you.
      - Develop each in a different direction for five minutes.
      - Keep the seed that grew most; note why.
    adaptation: >-
      Compressed class timing; optional Creative Campus tool/fixture photography with a no-people
      rule is a professor adaptation.
    quote:
      chicago: (Rubin 2023, 50)
      verbatim: >-
        Placing too much emphasis on a seed or dismissing it prematurely can interfere with its
        natural growth. The temptation to insert too much of yourself in this first phase can
        undermine the entire enterprise. Be wary of taking shortcuts or crossing items off your list
        too quickly. The seed that doesn’t get watered cannot reveal its ability to bear fruit.
        Collect many seeds and then, over time, look back and see which ones resonate. Sometimes
        we’re too close to them to recognize their true potential, and other times the magical
        moment that inspired a seed into existence is bigger than the seed itself. It’s generally
        preferable to accumulate several weeks’ or months’ worth of ideas and then choose which of
        them to focus on, instead of following an urge or obligation to rush to the finish line with
        what is in front of us today.
      ref_key: rubin-2023
    portfolio_trace: Five seeds; three developed; one kept with reason; consent note if photos.
    judged_by: Portfolio rubric — creative fluency, flexibility, and originality
    graphic:
      svg: /assets/images/exercise-graphics/seed-collection-f86850db985d3d85.svg
      png: /assets/images/exercise-graphics/seed-collection-f86850db985d3d85.png
      alt: >-
        Several unranked starting points are gathered, three are developed in different directions,
        and one is kept with a reason.
      caption: 'Delay ranking: collect broadly, develop a few seeds, then choose what has grown and why.'
    used_in:
      - /lessons/en/creativity-techniques/u-4-2-select-with-care/
  - id: visitor-journey-walkthrough
    title: Visitor Journey Walkthrough
    technique_id: contextual-observation
    status: ready
    categories:
      - urn:in-practice:concept:observation
      - family:framing
    fieldlex: []
    units:
      - U4
    summary: >-
      Walk a Creative Campus route from a first-time visitor’s side. Record actions and words;
      select one prior idea against evidence — not against taste.
    time_min: 20
    group: team; rotate walker, observer, recorder
    materials:
      - prior idea set (e.g. U4.1)
      - agreed public campus route to the Atrium information point
      - route note sheet
    requirements:
      - Do not impersonate a disability or claim to represent a community.
      - Do not record identifiable members of the public.
      - Peer walkthroughs are not visitor research.
    accessibility: Seated route-map walkthrough allowed; mark observed vs imagined parts.
    steps:
      - Agree the Creative Campus route, destination, and a neutral first-time visitor task.
      - >-
        One teammate walks without seeing the idea set; the observer records actions, words, pauses,
        and turns.
      - Switch roles or use a seated map walkthrough if needed.
      - >-
        Compare notes with the idea set; select one idea that responds to a recorded moment; name
        the criterion and one unresolved question.
    adaptation: >-
      Professor adaptation of “Walking in the Customer’s Shoes” to a short Creative Campus route
      with portfolio fields.
    quote:
      chicago: (Michalko 2010, 371)
      verbatim: >-
        Walking in the customer's shoes. In this approach, people turn around to find out what it's
        really like to be someone in a different position. For example, a realtor sent his
        salespeople to car dealerships to help them improve their selling skills. Posing as
        customers, they walked through the entire sales process, recording particular behavior,
        words, and actions that critically affected their attitude as 'buyers.' At the sales
        meeting, they shared their experiences and talked about ways they could improve their own
        selling skills. It was an eye-opening experience that made the salespeople see that it's one
        thing to talk about walking in someone else's shoes—and another to actually do it.
      ref_key: michalko-2010
    portfolio_trace: >-
      Route and task; roles; observation notes; selected idea and criterion; unresolved question;
      limitation note.
    judged_by: Portfolio rubric — critical analysis and judgement
    graphic:
      svg: /assets/images/exercise-graphics/visitor-journey-walkthrough-e44ba8aaf1a9170d.svg
      png: /assets/images/exercise-graphics/visitor-journey-walkthrough-e44ba8aaf1a9170d.png
      alt: >-
        A first-time visitor's route yields observed moments; one prior idea is selected against a
        recorded moment and criterion.
      caption: >-
        Choose against what the walkthrough revealed, not against taste; keep the unresolved
        question visible.
    used_in:
      - /lessons/en/creativity-techniques/u-4-2-select-with-care/
  - id: yes-and
    title: Yes, And
    technique_id: improv-yes-and
    status: pilot
    categories:
      - urn:in-practice:concept:association
      - family:embodied
    fieldlex:
      - ct:groupDynamics
      - ct:teamCommunication
    units:
      - U2
      - U4
    summary: >-
      Build one idea as a group by answering every offer with "Yes, and…". Then run the same round
      with "Yes, but…" and compare what happened to the idea and to the group.
    time_min: 25
    group: 4–6 in a circle
    materials:
      - one opening prompt (for example "a library for people who hate reading")
      - a scribe with paper or a shared board
      - timer
    requirements:
      - Listen to the whole offer before you add; you must build on the last thing said.
      - Everyone speaks at least once per round.
      - Keep the topic light for the first round so the rule, not the content, is the focus.
    accessibility: >-
      Offers can be spoken, written on cards passed around the circle, or typed into a shared chat.
      Students can sit or stand. A student who prefers not to speak may act as scribe and add in
      writing.
    steps:
      - >-
        Round one (eight minutes). The first person states the prompt as an idea. Each next person
        says "Yes, and…" and adds one detail that builds on the previous one.
      - The scribe writes each addition as a chain.
      - >-
        Round two (five minutes). Same prompt, but each person answers "Yes, but…" and names a
        problem before adding.
      - Compare the two chains. Count the additions. Mark where the idea grew and where it stalled.
      - Pick one surprising addition from round one and sketch it in two minutes.
    adaptation: >-
      Nixon presents "Yes, and" as a basic rule of improvisation and argues for its use at work. The
      two-round comparison, timings, scribe role, and closing sketch are professor adaptations. The
      "Yes, but" round is a contrast, not a recommendation; critique returns later in a separate
      selection step.
    quote:
      chicago: (Nixon 2020, chap. 4)
      verbatim: >-
        Being hyperpresent. One of the basic rules in improvisation is "Yes, and . . ." It is about
        agreement and building on a concept. It prevents the breakdown of momentum that comes from a
        "Yes, but . . ." or, even worse, straight-out "No" response. In order to build on the idea
        that someone has just offered to you, it is required that you engage in deep, intentional
        listening. It is an exercise in selflessness and generosity to give someone else your rapt
        attention and then amplify their idea, rather than wait for them to shut up so that you can
        focus on your own. Imagine if this principle were actively employed in our work
        environments. Think of the more energizing exchange of ideas we would have.
      ref_key: nixon-2020
    portfolio_trace: >-
      Both chains (photo or text); addition counts; one sentence on where the idea stalled; the
      two-minute sketch.
    judged_by: Portfolio rubric — process transparency
    graphic:
      svg: /assets/images/exercise-graphics/yes-and-23ba4dcedb4e8316.svg
      png: /assets/images/exercise-graphics/yes-and-23ba4dcedb4e8316.png
      alt: >-
        A chain of offers grows as each person adds with "yes, and", while a "yes, but" branch
        stalls after a few links.
      caption: >-
        Each "yes, and" builds on the last offer. Compare how far the idea travels when every turn
        starts with "but".
    used_in:
      - /lessons/en/creativity-techniques/u-2-idea-generation-selection/
      - /lessons/en/creativity-techniques/u-4-1-generate-before-you-judge/
