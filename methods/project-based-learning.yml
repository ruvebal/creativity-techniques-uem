id: project-based-learning
title: Project-based learning
kind: practice-learning
summary: >
  Learn by delivering a complete brief under constraints — not by collecting
  named techniques in isolation. The project is the unit of meaning; techniques
  serve the brief.
steps:
  - Receive or co-frame a design brief with criteria and deadline.
  - Plan milestones (research, diverge, select, develop, deliver).
  - Submit artefact + process note that explains decisions.
units: [U1, U2, U3, U4, U5, U6]
references: []
