id: diverge-converge-workshop
title: Diverge–converge workshop
kind: practice-learning
summary: >
  Time-boxed sessions that separate opening (many options) from closing
  (selection). Fluency without flexibility is one idea in many costumes.
steps:
  - Protect a diverge window (quantity + variety).
  - Switch modes deliberately into converge (criteria + pick).
  - Record what was discarded and why.
units: [U2, U3]
references: []
