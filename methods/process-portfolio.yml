id: process-portfolio
title: Process portfolio
kind: practice-learning
summary: >
  Evidence of learning is the trail — sketches, discarded options, criteria,
  and reflections — not only the final image. Authorship includes how meaning
  was put into circulation and revised.
steps:
  - Keep a dated process folder for every project.
  - Include at least one discarded path with a one-line reason.
  - Disclose tools (including AI) and what you still own as judgment.
