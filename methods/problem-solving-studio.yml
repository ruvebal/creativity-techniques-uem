id: problem-solving-studio
title: Problem-solving studio
kind: practice-learning
summary: >
  Treat creativity as situated problem work — frame the issue, explore options,
  test fitness, and defend the choice. Wicked briefs need framing before tools.
steps:
  - Name the problem and what would count as a good-enough answer.
  - Generate options without early judgment.
  - Select with explicit criteria and test against the brief.
units: [U1, U2, U3, U4]
references: []
