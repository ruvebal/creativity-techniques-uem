id: musae-dfa
title: MUSAE — Design Future Art-driven (DFA) method
kind: funded-transdisciplinary
funding:
  programme: Horizon Europe RIA (HORIZON-CL4-2021-HUMAN-01-21)
  grant_id: '101070421'
  cordis_url: https://cordis.europa.eu/project/id/101070421
  doi: 10.3030/101070421
  years: 2022–2025
  coordinator: Politecnico di Milano
  eu_contribution_eur: 3088475.50
summary: >
  EU-funded transdisciplinary method that merges Design Futures (POLIMI) with
  Art Thinking (Gluon / STARTS partners) so artists envision 5–10 year scenarios,
  critically reflect, and collaborate with technology providers (including AI)
  inside Digital Innovation Hubs. The “Factory Model” packages the method for
  replication — human-centred, art-driven technology innovation rather than
  brainstorming theatre.
steps:
  - Envision future scenarios (5–10 years) through artistic practice.
  - Critically reflect on those futures against wellbeing and sustainability goals.
  - Collaborate with technology partners (AI, wearables, robotics, HMI) to prototype responses.
  - Package transferable “factory” guidelines for Digital Innovation Hubs.
